# ==============================================================================
# ArcIA Enterprise Platform — Déploiement Local Docker Compose (Mode Lab)
# ==============================================================================
# Ce fichier permet de lancer immédiatement l'ensemble des services ArcIA en
# local sur n'importe quelle machine disposant de Docker Desktop ou Docker Engine.
#
# Utilisation :
#   docker compose -f docker-compose.lab.yml up -d
#
# Accès :
#   - Portail Open-WebUI : http://localhost:3000
#   - Passerelle LiteLLM : http://localhost:4000
#   - Guardrail Presidio : http://localhost:5001
# ==============================================================================

services:
  # 1. Portail Utilisateur Open-WebUI
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.5.10
    container_name: arcia-webui-lab
    restart: unless-stopped
    ports:
      - "${WEBUI_PORT:-3000}:8080"
    environment:
      - OPENAI_API_BASE_URL=http://litellm-proxy:4000/v1
      - OPENAI_API_KEY=${LITELLM_MASTER_KEY:-sk-or-v1-arcia-lab}
      - WEBUI_AUTH=true
      - ENABLE_SIGNUP=false
      - WEBUI_NAME=ArcIA Enterprise Portal
      - CUSTOM_NAME=ArcIA
      - WEBUI_THEME=dark
      - CUSTOM_CSS=body, .dark body { background-color: #050712 !important; color: #f8fafc !important; } .dark #sidebar { background-color: #0a0f1d !important; border-right: 1px solid #1e293b !important; } .dark .bg-gray-900, .dark .bg-gray-950, .dark .bg-gray-850 { background-color: #0a0f1d !important; } .dark .bg-gray-800 { background-color: #131b2e !important; border-color: #1e293b !important; } .dark .bg-emerald-600, .dark .bg-blue-600 { background: linear-gradient(135deg, #1659e4, #5ad8ce) !important; color: #ffffff !important; } *:focus-visible { outline: 2px solid #6be7dd !important; }
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@arcia.local}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-AdminArcIA2026!}
      - DEFAULT_USER_ROLE=user
      - BYPASS_MODEL_ACCESS_CONTROL=false
      - ENABLE_MODEL_FILTER=true
      - MODEL_FILTER_LIST=simple/free;simple/auto;agentic/free;agentic/auto;agentic/expert
      - DEFAULT_MODELS=simple/auto
      - ENABLE_DIRECT_CONNECTIONS=false
    volumes:
      - arcia_webui_data:/app/backend/data
    depends_on:
      - litellm-proxy

  # 2. Passerelle d'Inférence IA LiteLLM Proxy
  litellm-proxy:
    image: ghcr.io/berriai/litellm:main-v1.72.6-stable
    container_name: arcia-litellm-lab
    restart: unless-stopped
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-sk-or-v1-arcia-lab}
    volumes:
      - ./deploy/litellm-lab.yaml:/app/config.yaml:ro
      - ./services/litellm/error_handler.py:/app/error_handler.py:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]

  # 3. Guardrail DLP Microsoft Presidio Anonymizer
  presidio-anonymizer:
    image: mcr.microsoft.com/presidio-anonymizer:2.2.358
    container_name: arcia-presidio-anonymizer-lab
    restart: unless-stopped
    ports:
      - "${PRESIDIO_ANON_PORT:-5001}:3000"

  # 4. Guardrail DLP Microsoft Presidio Analyzer
  presidio-analyzer:
    image: mcr.microsoft.com/presidio-analyzer:2.2.358
    container_name: arcia-presidio-analyzer-lab
    restart: unless-stopped
    ports:
      - "${PRESIDIO_ANALYZER_PORT:-5002}:3000"

volumes:
  arcia_webui_data:
