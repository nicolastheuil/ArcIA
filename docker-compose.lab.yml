# ==============================================================================
# ArcIA Enterprise Platform — Déploiement Local Docker Compose (Mode Lab)
# ==============================================================================
# Ce fichier permet de lancer immédiatement l'ensemble des services ArcIA en
# local sur n'importe quelle machine disposant de Docker Desktop ou Docker Engine.
#
# Utilisation :
#   docker compose -f docker-compose.lab.yml up -d
#
# Accès :
#   - Portail Open-WebUI : http://localhost:3000
#   - Passerelle LiteLLM : http://localhost:4000
#   - Guardrail Presidio : http://localhost:5001
# ==============================================================================

services:
  # 1. Portail Utilisateur Open-WebUI
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: arcia-webui-lab
    restart: unless-stopped
    ports:
      - "${WEBUI_PORT:-3000}:8080"
    environment:
      - OPENAI_API_BASE_URL=http://litellm-proxy:4000/v1
      - OPENAI_API_KEY=${LITELLM_MASTER_KEY:-sk-or-v1-arcia-lab}
      - WEBUI_AUTH=true
      - ENABLE_SIGNUP=false
      - WEBUI_NAME=ArcIA Enterprise Portal (Lab)
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@arcia.local}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-AdminArcIA2026!}
      - BYPASS_MODEL_ACCESS_CONTROL=true
    volumes:
      - arcia_webui_data:/app/backend/data
    depends_on:
      - litellm-proxy

  # 2. Passerelle d'Inférence IA LiteLLM Proxy
  litellm-proxy:
    image: ghcr.io/berriai/litellm:main-v1.61.16
    container_name: arcia-litellm-lab
    restart: unless-stopped
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-sk-or-v1-arcia-lab}
    volumes:
      - ./deploy/litellm-lab.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]

  # 3. Guardrail DLP Microsoft Presidio Anonymizer
  presidio-anonymizer:
    image: mcr.microsoft.com/presidio-anonymizer:2.2.358
    container_name: arcia-presidio-anonymizer-lab
    restart: unless-stopped
    ports:
      - "${PRESIDIO_ANON_PORT:-5001}:3000"

  # 4. Guardrail DLP Microsoft Presidio Analyzer
  presidio-analyzer:
    image: mcr.microsoft.com/presidio-analyzer:2.2.358
    container_name: arcia-presidio-analyzer-lab
    restart: unless-stopped
    ports:
      - "${PRESIDIO_ANALYZER_PORT:-5002}:3000"

volumes:
  arcia_webui_data:
