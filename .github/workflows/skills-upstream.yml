name: Check upstream skills candidates
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidates:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.4'
      - run: python -m pip install -r requirements-validation.txt
      - name: Inspect public upstream revisions without deployment or Git writes
        run: python scripts/refresh_skills_catalog.py --latest
