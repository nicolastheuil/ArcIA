name: Validate synthetic preparation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.4'
      - run: python -m pip install -r requirements-validation.txt
      - run: python -m pip install --require-hashes -r requirements-vmware.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/validate_sources.py
      - run: python scripts/validate_docs.py
      - run: python scripts/validate_bootstrap.py
      - run: python -m pip install --require-hashes -r builder/requirements-tools.lock.txt
      - name: LintLang instructions report (non-blocking findings)
        env:
          DISABLE_TELEMETRY: '1'
        run: lintlang scan AGENTS.md builder/role.md --format json
      - run: python scripts/harness.py plan --config examples/synthetic/instance.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26.7.0'
      - run: npm ci --prefix validation --ignore-scripts --no-audit --no-fund
      - run: node validation/diagrams.mjs
  powershell:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - shell: pwsh
        run: |
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
            $tokens = $null; $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { throw 'POWERSHELL_PARSE_FAILED' }
          }
      - shell: pwsh
        run: ./tests/Test-ProtectedState.ps1
      - shell: powershell
        name: Parse local OmniRoute access with Windows PowerShell
        run: |
          foreach ($path in @('scripts/ProtectedState.ps1', 'scripts/Show-RoutingAccess.ps1', 'scripts/Invoke-ClusterFoundation.ps1')) {
            $tokens = $null; $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $path), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { throw 'WINDOWS_POWERSHELL_ROUTING_ACCESS_PARSE_FAILED' }
          }
      - shell: pwsh
        run: ./tests/Test-IdentityState.ps1
      - shell: pwsh
        run: ./tests/Test-Bootstrap.ps1
      - shell: pwsh
        run: ./scripts/Bootstrap-Harness.ps1 -Mode Plan -Profile Fresh -ProvisionVMs
      - shell: powershell
        run: ./tests/Test-DnsPlan.ps1
      - shell: powershell
        run: ./tests/Test-SsoSecurity.ps1
      - shell: powershell
        run: ./tests/Test-LocalDnsPlan.ps1
