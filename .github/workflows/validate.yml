name: Validate ArcIA Platform

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-linux:
    name: Validate Suite (Ubuntu Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Validation Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-validation.txt

      - name: Run Unit Tests & Privacy Boundary Gate
        run: |
          python -m unittest discover -s tests -v

      - name: Test Deployment Engine with Valid Configuration (Dry-Run)
        run: |
          python -c "
          with open('arcia.config.yaml.example', 'r', encoding='utf-8') as f:
              c = f.read()
          c = c.replace('sk-or-v1-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx', 'sk-or-v1-ci-test-key-1234567890')
          c = c.replace('assistant.example.org', 'ci.example.org')
          with open('ci.config.yaml', 'w', encoding='utf-8') as f:
              f.write(c)
          "
          python scripts/deploy.py --config ci.config.yaml --dry-run
          rm -f ci.config.yaml

      - name: Validate Shell Scripts Syntax
        run: |
          bash -n scripts/deploy-arcia.sh
          bash -n scripts/apply-secrets.sh
          bash -n scripts/test-validation.sh
          bash -n skills/sync-skills.sh

  validate-windows:
    name: Validate PowerShell & Windows (Windows Server 2025)
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Parse PowerShell Scripts Syntax
        shell: pwsh
        run: |
          Get-ChildItem -Path scripts/*.ps1 | ForEach-Object {
            $tokens = $null; $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              Write-Error "Syntax error in $($_.Name): $($errors | Out-String)"
              exit 1
            }
            Write-Host "OK: $($_.Name)" -ForegroundColor Green
          }

      - name: Test Deploy-ArcIA PowerShell Wrapper (Dry-Run)
        shell: pwsh
        run: |
          python -c "
          with open('arcia.config.yaml.example', 'r', encoding='utf-8') as f:
              c = f.read()
          c = c.replace('sk-or-v1-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx', 'sk-or-v1-ci-test-key-1234567890')
          c = c.replace('assistant.example.org', 'ci.example.org')
          with open('ci.config.yaml', 'w', encoding='utf-8') as f:
              f.write(c)
          "
          .\scripts\Deploy-ArcIA.ps1 -ConfigFile ci.config.yaml -DryRun
          Remove-Item -Force ci.config.yaml
