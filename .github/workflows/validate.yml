name: Validate ArcIA platform

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-linux:
    name: Validate suite (Ubuntu Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-validation.txt

      - name: Run unit tests and documentation checks
        run: |
          python -m unittest discover -s tests -v
          python scripts/validate_docs.py

      - name: Validate deployment configuration (dry-run)
        run: python scripts/deploy.py --config tests/fixtures/deploy.synthetic.yaml --dry-run

      - name: Validate shell script syntax
        run: |
          bash -n scripts/deploy-arcia.sh
          bash -n scripts/apply-secrets.sh
          bash -n scripts/test-validation.sh
          bash -n skills/sync-skills.sh

  validate-windows:
    name: Validate PowerShell and Windows (Windows Server 2025)
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Parse PowerShell script syntax
        shell: pwsh
        run: |
          Get-ChildItem -Path scripts/*.ps1 | ForEach-Object {
            $tokens = $null; $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              Write-Error "Syntax error in $($_.Name): $($errors | Out-String)"
              exit 1
            }
            Write-Host "OK: $($_.Name)" -ForegroundColor Green
          }

      - name: Test Deploy-ArcIA PowerShell wrapper (dry-run)
        shell: pwsh
        run: |
          .\scripts\Deploy-ArcIA.ps1 -ConfigFile tests/fixtures/deploy.synthetic.yaml -DryRun
