---
- name: Inspect existing K3s ownership
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /var/lib/rancher/k3s
    - /etc/rancher/k3s/config.yaml
    - /etc/rancher/k3s/arcia-owner.json
    - /usr/local/bin/k3s
  register: hermes_existing
  no_log: true

- name: Refuse adoption of an unrelated installation
  ansible.builtin.assert:
    that:
      - hermes_existing.results[2].stat.exists or not (hermes_existing.results[0].stat.exists or hermes_existing.results[1].stat.exists or hermes_existing.results[3].stat.exists)
  no_log: true

- name: Define stable installation identity
  ansible.builtin.set_fact:
    hermes_owner:
      format: 1
      config_sha256: "{{ hermes_k3s_config | to_json(sort_keys=true) | hash('sha256') }}"
      token_sha256: "{{ hermes_k3s_token | hash('sha256') }}"
      version: "{{ hermes_lock.components.k3s.version }}"
  no_log: true

- name: Read existing installation identity
  ansible.builtin.slurp:
    src: /etc/rancher/k3s/arcia-owner.json
  register: hermes_previous_owner
  when: hermes_existing.results[2].stat.exists
  no_log: true

- name: Refuse implicit version, configuration or token migration
  ansible.builtin.assert:
    that:
      - (hermes_previous_owner.content | b64decode | from_json) == hermes_owner
  when: hermes_existing.results[2].stat.exists
  no_log: true

- name: Read existing configuration and token for drift detection
  ansible.builtin.slurp:
    src: "{{ item }}"
  loop:
    - /etc/rancher/k3s/config.yaml
    - /etc/rancher/k3s/cluster-token
  register: hermes_existing_content
  when: hermes_existing.results[1].stat.exists
  no_log: true

- name: Refuse manual drift before changing anything
  ansible.builtin.assert:
    that:
      - (hermes_existing_content.results[0].content | b64decode | from_json) == hermes_k3s_config
      - (hermes_existing_content.results[1].content | b64decode | trim) == hermes_k3s_token
  when: hermes_existing.results[1].stat.exists
  no_log: true

- name: Create protected configuration directory before reserving identity
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Reserve installation identity for safe retry after interruption
  ansible.builtin.copy:
    content: "{{ hermes_owner | to_nice_json }}\n"
    dest: /etc/rancher/k3s/arcia-owner.json
    owner: root
    group: root
    mode: '0600'
  no_log: true

- name: Create artifact directories after installation identity is reserved
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0700'
  loop:
    - /var/lib/rancher/k3s/agent/images
    - /var/cache/arcia

- name: Install required Debian utilities
  ansible.builtin.apt:
    name: [ca-certificates, iptables, iproute2, kmod, conntrack, zstd, open-iscsi]
    state: present
    update_cache: true
    cache_valid_time: 3600
  # Pin via a dated Debian snapshot before claiming a reproducible release.

- name: Persist required kernel modules
  ansible.builtin.copy:
    content: "overlay\nbr_netfilter\nvxlan\ntun\n"
    dest: /etc/modules-load.d/arcia-k3s.conf
    owner: root
    group: root
    mode: '0644'

- name: Load required modules
  ansible.builtin.command:
    argv: [modprobe, "{{ item }}"]
  loop: [overlay, br_netfilter, vxlan, tun]
  changed_when: false

- name: Persist network sysctls
  ansible.builtin.copy:
    content: "net.ipv4.ip_forward=1\nnet.bridge.bridge-nf-call-iptables=1\nnet.bridge.bridge-nf-call-ip6tables=1\n"
    dest: /etc/sysctl.d/90-arcia-k3s.conf
    owner: root
    group: root
    mode: '0644'
  register: hermes_sysctls

- name: Apply only the managed sysctl file
  ansible.builtin.command:
    argv: [sysctl, -p, /etc/sysctl.d/90-arcia-k3s.conf]
  when: hermes_sysctls.changed
  changed_when: true

- name: Write token without logging or placing it in command arguments
  ansible.builtin.copy:
    content: "{{ hermes_k3s_token }}\n"
    dest: /etc/rancher/k3s/cluster-token
    owner: root
    group: root
    mode: '0600'
  no_log: true

- name: Write exact common server configuration
  ansible.builtin.copy:
    content: "{{ hermes_k3s_config | to_nice_json }}\n"
    dest: /etc/rancher/k3s/config.yaml
    owner: root
    group: root
    mode: '0600'
  no_log: true

- name: Fetch pinned artifacts and verify their SHA256 before use
  ansible.builtin.get_url:
    url: "{{ item.url }}"
    dest: "{{ item.dest }}"
    checksum: "sha256:{{ item.sha256 }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
    timeout: 120
  loop:
    - {url: "{{ hermes_lock.components.k3s.installer_url }}", sha256: "{{ hermes_lock.components.k3s.installer_sha256 }}", dest: /var/cache/arcia/install-k3s.sh, mode: '0700'}
    - {url: "{{ hermes_lock.components.k3s.binary_url }}", sha256: "{{ hermes_lock.components.k3s.binary_sha256 }}", dest: /usr/local/bin/k3s, mode: '0755'}
    - {url: "{{ hermes_lock.components.k3s.images_url }}", sha256: "{{ hermes_lock.components.k3s.images_sha256 }}", dest: /var/lib/rancher/k3s/agent/images/k3s-airgap-images-amd64.tar.zst, mode: '0600'}

- name: Install service using fixed local artifacts
  ansible.builtin.command:
    argv: [/bin/sh, /var/cache/arcia/install-k3s.sh, server]
    creates: /etc/systemd/system/k3s.service
  environment:
    INSTALL_K3S_VERSION: "{{ hermes_lock.components.k3s.version }}"
    INSTALL_K3S_SKIP_DOWNLOAD: 'true'
    INSTALL_K3S_SKIP_START: 'true'
    INSTALL_K3S_SKIP_ENABLE: 'true'
  no_log: true

- name: Overwrite service with launcher to avoid re-exec loop
  ansible.builtin.copy:
    dest: /etc/systemd/system/k3s.service
    content: |
      [Unit]
      Description=Lightweight Kubernetes
      Documentation=https://k3s.io
      Wants=network-online.target
      After=network-online.target

      [Install]
      WantedBy=multi-user.target

      [Service]
      Type=notify
      EnvironmentFile=-/etc/default/%N
      EnvironmentFile=-/etc/sysconfig/%N
      EnvironmentFile=-/etc/systemd/system/k3s.service.env
      KillMode=process
      Delegate=yes
      User=root
      LimitNOFILE=1048576
      LimitNPROC=infinity
      LimitCORE=infinity
      TasksMax=infinity
      TimeoutStartSec=0
      Restart=always
      RestartSec=5s
      ExecStartPre=-/sbin/modprobe br_netfilter
      ExecStartPre=-/sbin/modprobe overlay
      ExecStartPre=-/bin/rm -rf /var/lib/rancher/k3s/data
      ExecStart=/usr/local/bin/k3s-server-launcher
    mode: '0644'
  no_log: true

- name: Ensure launcher script exists
  ansible.builtin.copy:
    dest: /usr/local/bin/k3s-server-launcher
    content: |
      #!/bin/bash
      exec -a k3s-server /usr/local/bin/k3s server "$@"
    mode: '0755'
  no_log: true

- name: Ensure k3s-server wrapper exists (prevents re-exec loop)
  ansible.builtin.copy:
    dest: /usr/local/bin/k3s-server
    content: |
      #!/bin/bash
      if [[ -n "$K3S_REEXEC_DONE" ]]; then
        export K3S_CONFIG_FILE="/etc/rancher/k3s/config.yaml"
        export K3S_DATA_DIR="/var/lib/rancher/k3s"
        export K3S_TOKEN_FILE="/etc/rancher/k3s/cluster-token"
        exec -a k3s-server /usr/local/bin/k3s "$@"
      fi
      export K3S_REEXEC_DONE=1
      args=("$@")
      if [[ ${args[0]} == "server" ]]; then
        args=("${args[@]:1}")
      fi
      exec -a k3s-server /usr/local/bin/k3s server "${args[@]}"
    mode: '0755'
  no_log: true

- name: Ensure k3s-agent wrapper exists (prevents re-exec loop)
  ansible.builtin.copy:
    dest: /usr/local/bin/k3s-agent
    content: |
      #!/bin/bash
      if [[ -n "$K3S_REEXEC_DONE" ]]; then
        export K3S_CONFIG_FILE="/etc/rancher/k3s/config.yaml"
        export K3S_DATA_DIR="/var/lib/rancher/k3s"
        export K3S_TOKEN_FILE="/etc/rancher/k3s/cluster-token"
        exec -a k3s-agent /usr/local/bin/k3s "$@"
      fi
      export K3S_REEXEC_DONE=1
      args=("$@")
      if [[ ${args[0]} == "agent" ]]; then
        args=("${args[@]:1}")
      fi
      exec -a k3s-agent /usr/local/bin/k3s agent "${args[@]}"
    mode: '0755'
  no_log: true

- name: Disable core dumps in K3s processes
  ansible.builtin.file:
    path: /etc/systemd/system/k3s.service.d
    state: directory
    mode: '0755'

- name: Configure core dump limit
  ansible.builtin.copy:
    content: "[Service]\nLimitCORE=0\n"
    dest: /etc/systemd/system/k3s.service.d/10-arcia-security.conf
    mode: '0644'

- name: Ensure systemd daemon is reloaded after service changes
  ansible.builtin.systemd:
    daemon_reload: true

- name: Start k3s service (idempotent)
  ansible.builtin.systemd:
    name: k3s
    enabled: true
    state: started

- name: Verify local API health before adding the next server
  ansible.builtin.command:
    argv: [/usr/local/bin/k3s, kubectl, get, --raw=/readyz]
  register: hermes_ready
  until: hermes_ready.rc == 0
  retries: 30
  delay: 5
  changed_when: false
  no_log: true

- name: Verify secrets encryption is enabled
  ansible.builtin.command:
    argv: [/usr/local/bin/k3s, secrets-encrypt, status]
  register: hermes_encryption
  changed_when: false
  failed_when: hermes_encryption.rc != 0 or 'Encryption Status' not in hermes_encryption.stdout or 'Enabled' not in hermes_encryption.stdout
  no_log: true
