---
- name: Require a qualified and explicitly designated target before mutation
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Enforce preparation gates
      ansible.builtin.assert:
        that:
          - groups['k3s_servers'] | length == 3
          - hostvars[groups['k3s_servers'][0]].hermes_installation_ready | bool
          - hostvars[groups['k3s_servers'][0]].hermes_safe_mode | bool
          - hostvars[groups['k3s_servers'][0]].hermes_lock.components.k3s.status in ['source_verified_not_qualified', 'qualified']
          - hostvars[groups['k3s_servers'][0]].hermes_lock.components.vsphere_cpi.image_digest is match('^sha256:[a-f0-9]{64}$')
        fail_msg: 'INSTALLATION_BLOCKED: qualification/cible/CPI/endpoint manquants.'
      no_log: true

- ansible.builtin.import_playbook: preflight.yml

- name: Bootstrap one server at a time
  hosts: k3s_servers
  order: inventory
  serial: 1
  any_errors_fatal: true
  gather_facts: false
  become: true
  roles:
    - role: k3s
