# 1. Ingress Public (Open-WebUI, OAuth2, Bot Teams)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: arcia-public-ingress
  namespace: arcia
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: "web,websecure"
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  tls:
  - hosts:
    - assistant.example.org
    secretName: arcia-tls-cert
  rules:
  - host: assistant.example.org
    http:
      paths:
      - path: /oauth2
        pathType: Prefix
        backend:
          service:
            name: oauth2-proxy
            port:
              number: 4180
      - path: /api/teams/messages
        pathType: Prefix
        backend:
          service:
            name: teams-bot-adapter
            port:
              number: 3978
      - path: /
        pathType: Prefix
        backend:
          service:
            name: open-webui
            port:
              number: 8080
---
# 2. Ingress Power Users /v1 (Protégé par Middleware RateLimit Traefik)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: arcia-v1-ingress
  namespace: arcia
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: "web,websecure"
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: arcia-litellm-ratelimit@kubernetescrd
spec:
  tls:
  - hosts:
    - assistant.example.org
    secretName: arcia-tls-cert
  rules:
  - host: assistant.example.org
    http:
      paths:
      - path: /v1
        pathType: Prefix
        backend:
          service:
            name: litellm-proxy
            port:
              number: 4000
---
# 3. Ingress Studio & Gateway (Hermes Studio & Hermes Desktop Gateway - Sécurisé par Entra ID)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: arcia-studio-ingress
  namespace: arcia
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: "web,websecure"
    traefik.ingress.kubernetes.io/router.tls: "true"
    # Authentification obligatoire via MS365 Entra ID
    traefik.ingress.kubernetes.io/router.middlewares: arcia-entra-id-auth@kubernetescrd
spec:
  tls:
  - hosts:
    - assistant.example.org
    secretName: arcia-tls-cert
  rules:
  - host: assistant.example.org
    http:
      paths:
      - path: /studio
        pathType: Prefix
        backend:
          service:
            name: hermes-studio
            port:
              number: 9119
      - path: /gateway
        pathType: Prefix
        backend:
          service:
            name: hermes-studio
            port:
              number: 8642
---
# 4. Middleware Rate Limiting pour l'endpoint public /v1
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: litellm-ratelimit
  namespace: arcia
spec:
  rateLimit:
    average: 100
    burst: 50
