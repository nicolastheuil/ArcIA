# 1. Ingress Public (Open-WebUI, OAuth2, Bot Teams)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: arcia-public-ingress
  namespace: arcia
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: "web,websecure"
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  tls:
  - hosts:
    - assistant.example.org
    secretName: arcia-tls-cert
  rules:
  - host: assistant.example.org
    http:
      paths:
      - path: /oauth2
        pathType: Prefix
        backend:
          service:
            name: oauth2-proxy
            port:
              number: 4180
      - path: /api/teams/messages
        pathType: Prefix
        backend:
          service:
            name: teams-bot-adapter
            port:
              number: 3978
      - path: /
        pathType: Prefix
        backend:
          service:
            name: open-webui
            port:
              number: 8080
---
# 2. Ingress Power Users /v1 (Protégé par Middleware RateLimit Traefik)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: arcia-v1-ingress
  namespace: arcia
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: "web,websecure"
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: arcia-litellm-ratelimit@kubernetescrd
spec:
  tls:
  - hosts:
    - assistant.example.org
    secretName: arcia-tls-cert
  rules:
  - host: assistant.example.org
    http:
      paths:
      - path: /v1
        pathType: Prefix
        backend:
          service:
            name: litellm-proxy
            port:
              number: 4000
---
# 3. Ingress Studio (Hermes Studio Dashboard — Authentification native admin/password)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: arcia-studio-ingress
  namespace: arcia
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: "web,websecure"
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: arcia-studio-prefix@kubernetescrd,arcia-studio-stripprefix@kubernetescrd
spec:
  tls:
  - hosts:
    - assistant.example.org
    secretName: arcia-tls-cert
  rules:
  - host: assistant.example.org
    http:
      paths:
      - path: /studio
        pathType: Prefix
        backend:
          service:
            name: hermes-studio
            port:
              number: 9119
---
# 4. Ingress Gateway Desktop (Hermes Gateway API & WebSocket — Protégé par PAT)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: arcia-gateway-ingress
  namespace: arcia
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: "web,websecure"
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: arcia-gateway-stripprefix@kubernetescrd
spec:
  tls:
  - hosts:
    - assistant.example.org
    secretName: arcia-tls-cert
  rules:
  - host: assistant.example.org
    http:
      paths:
      - path: /gateway
        pathType: Prefix
        backend:
          service:
            name: hermes-studio
            port:
              number: 8642
---
# 5. Middlewares Traefik (Rate Limiting, Prefix et StripPrefix)
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: litellm-ratelimit
  namespace: arcia
spec:
  rateLimit:
    average: 100
    burst: 50
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: studio-prefix
  namespace: arcia
spec:
  headers:
    customRequestHeaders:
      X-Forwarded-Prefix: "/studio"
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: studio-stripprefix
  namespace: arcia
spec:
  stripPrefix:
    prefixes:
      - /studio
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: gateway-stripprefix
  namespace: arcia
spec:
  stripPrefix:
    prefixes:
      - /gateway
