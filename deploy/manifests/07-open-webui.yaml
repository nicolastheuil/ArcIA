apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: open-webui-pvc
  namespace: arcia
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: arcia
spec:
  replicas: 1
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      containers:
      - name: open-webui
        image: ghcr.io/open-webui/open-webui:main
        ports:
        - containerPort: 8080
        env:
        - name: WEBUI_NAME
          value: "ArcIA"
        - name: CUSTOM_NAME
          value: "ArcIA"
        - name: WEBUI_THEME
          value: "dark"
        - name: WEBUI_BANNERS
          value: '[{"id":"arcia-brand","type":"info","title":"⚡ ArcIA — Enterprise Agentic Platform","content":"Plateforme IA Agentique Souveraine d''Entreprise • Hermes Agent & LiteLLM","dismissible":true}]'
        - name: CUSTOM_CSS
          value: |
            :root {
              --font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
              --color-primary: #1659e4;
              --color-primary-dark: #0c2762;
              --color-primary-light: #6be7dd;
              --arcia-noir: #050712;
              --arcia-deep-navy: #0c2762;
              --arcia-royal-blue: #1659e4;
              --arcia-cyan: #6be7dd;
              --arcia-coral: #fa7b4e;
              --arcia-gold: #f1c557;
              --arcia-text-primary: #f8fafc;
            }
            body, .dark body {
              font-family: var(--font-family) !important;
              background-color: #050712 !important;
              color: #f8fafc !important;
            }
            .dark #sidebar, .dark .sidebar {
              background-color: #0a0f1d !important;
              border-right: 1px solid #1e293b !important;
            }
            .dark .bg-gray-900, .dark .bg-gray-950, .dark .bg-gray-850 {
              background-color: #0a0f1d !important;
            }
            .dark .bg-gray-800, .dark .bg-gray-700 {
              background-color: #131b2e !important;
              border-color: #1e293b !important;
            }
            .dark .bg-emerald-600, .dark .bg-emerald-700, .dark .bg-blue-600, .dark .bg-primary-600,
            button[type="submit"].bg-black, button.bg-black {
              background: linear-gradient(135deg, #1659e4 0%, #5ad8ce 100%) !important;
              color: #ffffff !important;
              border: none !important;
              font-weight: 600 !important;
            }
            button[type="submit"]:hover, button.bg-black:hover {
              filter: brightness(1.12) !important;
              box-shadow: 0 0 12px rgba(107, 231, 221, 0.35) !important;
            }
            *:focus-visible {
              outline: 2px solid #6be7dd !important;
              outline-offset: 1px !important;
            }
            /* Injection Logo officiel ArcIA (Monogramme Squircle Dark) */
            img[alt="Open WebUI"], .sidebar-header img, #logo, img[src*="favicon"], img[src*="logo"] {
              content: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20512%20512%22%20width%3D%22512%22%20height%3D%22512%22%20fill%3D%22none%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22bg%22%20x1%3D%2264%22%20y1%3D%2232%22%20x2%3D%22448%22%20y2%3D%22480%22%20gradientUnits%3D%22userSpaceOnUse%22%3E%3Cstop%20offset%3D%220%25%22%20stop-color%3D%22%23131B2E%22/%3E%3Cstop%20offset%3D%2255%25%22%20stop-color%3D%22%230A0F1D%22/%3E%3Cstop%20offset%3D%22100%25%22%20stop-color%3D%22%23050712%22/%3E%3C/linearGradient%3E%3ClinearGradient%20id%3D%22c%22%20x1%3D%2280%22%20y1%3D%2298%22%20x2%3D%22224%22%20y2%3D%220%22%20gradientUnits%3D%22userSpaceOnUse%22%3E%3Cstop%20offset%3D%220%25%22%20stop-color%3D%22%235AD8CE%22/%3E%3Cstop%20offset%3D%22100%25%22%20stop-color%3D%22%236BE7DD%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20x%3D%2224%22%20y%3D%2224%22%20width%3D%22464%22%20height%3D%22464%22%20rx%3D%22108%22%20fill%3D%22url%28%23bg%29%22%20stroke%3D%22%231E293B%22%20stroke-width%3D%228%22/%3E%3Cg%20transform%3D%22translate%2868%2C%20174%29%20scale%281.68%29%22%3E%3Cpath%20d%3D%22M43.61%2026C47.78%2026.09%2051.8%2026.57%2055.66%2027.43%2059.52%2028.29%2062.99%2030.27%2066.07%2033.36%2068.7%2035.9%2070.54%2038.89%2071.58%2042.35%2072.63%2045.8%2073.15%2049.34%2073.15%2052.96L73.15%2097.75%2022.24%2097.75C14.89%2097.75%209.25%2095.73%205.35%2091.69%201.45%2087.66-0.32%2082.06%200.05%2074.88%200.68%2066.26%203.72%2060.68%209.17%2058.13%2014.62%2055.59%2021.11%2054.32%2028.64%2054.32L53.55%2054.19C53.82%2048.29%2052.3%2044.61%2048.99%2043.16%2045.68%2041.71%2041.48%2040.98%2036.4%2040.98L4.81%2040.84%204.81%2026%2043.61%2026ZM29.99%2083.32%2053.68%2083.32%2053.68%2068.48%2031.35%2068.48C31.17%2068.57%2030.99%2068.62%2030.81%2068.62L30.27%2068.62C27.73%2068.71%2025.37%2069.19%2023.19%2070.05%2021.01%2070.91%2019.87%2072.93%2019.78%2076.1%2019.6%2079.64%2020.57%2081.73%2022.71%2082.37%2024.84%2083.01%2027.27%2083.37%2029.99%2083.46L29.99%2083.32Z%22%20fill%3D%22%23F8FAFC%22/%3E%3Cpath%20d%3D%22M82.92%2097.76%20L100.16%200%20L121.67%200%20L104.43%2097.76%20Z%22%20fill%3D%22url%28%23c%29%22/%3E%3Cpath%20fill-rule%3D%22evenodd%22%20clip-rule%3D%22evenodd%22%20d%3D%22M177.86%200%20L199.65%200%20L224.07%2097.76%20L201.20%2097.76%20L196.32%2074.48%20L153.84%2074.48%20L141.02%2097.76%20L119.37%2097.76%20L177.86%200%20Z%20M184.51%2019.47%20L163.58%2057.05%20L192.72%2057.05%20L184.51%2019.47%20Z%22%20fill%3D%22url%28%23c%29%22/%3E%3C/g%3E%3C/svg%3E") !important;
              border-radius: 8px !important;
            }
        - name: WEBUI_AUTH
          value: "true"
        - name: ENABLE_SIGNUP
          value: "false"
        - name: DEFAULT_USER_ROLE
          value: "user"
        - name: BYPASS_MODEL_ACCESS_CONTROL
          value: "false"
        - name: ENABLE_PERSISTENT_CONFIG
          value: "false"
        - name: OPENAI_API_BASE_URLS
          value: "http://litellm-proxy.arcia.svc:4000/v1"
        - name: OPENAI_API_KEYS
          valueFrom:
            secretKeyRef:
              name: litellm-secret
              key: master-key
        - name: OPENAI_API_BASE_URL
          value: "http://litellm-proxy.arcia.svc:4000/v1"
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: litellm-secret
              key: master-key
        - name: ENABLE_OLLAMA_API
          value: "false"
        - name: ENABLE_OPENAI_API
          value: "true"
        - name: DEFAULT_MODELS
          value: "arcia/standard"
        - name: TASK_MODEL
          value: "arcia/standard"
        - name: ENABLE_SUBAGENTS
          value: "true"
        - name: ENABLE_DIRECT_CONNECTIONS
          value: "false"
        - name: ENABLE_FORWARD_USER_INFO_HEADERS
          value: "true"
        - name: ENABLE_OAUTH_SIGNUP
          value: "true"
        - name: OAUTH_MERGE_ACCOUNTS_BY_EMAIL
          value: "false"
        - name: OAUTH_PROVIDER_NAME
          value: "Microsoft Entra ID"
        - name: ENTRA_TENANT_ID
          valueFrom:
            secretKeyRef:
              name: entraid-secret
              key: tenant-id
        - name: OAUTH_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: entraid-secret
              key: client-id
        - name: OAUTH_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: entraid-secret
              key: client-secret
        - name: OPENID_PROVIDER_URL
          value: "https://login.microsoftonline.com/$(ENTRA_TENANT_ID)/v2.0/.well-known/openid-configuration"
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 2Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
        volumeMounts:
        - name: webui-data
          mountPath: /app/backend/data
        - name: arcia-branding
          mountPath: /app/build/static/favicon.svg
          subPath: favicon.svg
        - name: arcia-branding
          mountPath: /app/build/static/logo.svg
          subPath: logo.svg
      volumes:
      - name: webui-data
        persistentVolumeClaim:
          claimName: open-webui-pvc
      - name: arcia-branding
        configMap:
          name: arcia-webui-branding
          optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: open-webui
  namespace: arcia
spec:
  selector:
    app: open-webui
  ports:
  - port: 8080
    targetPort: 8080
