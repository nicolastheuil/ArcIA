apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: open-webui-pvc
  namespace: arcia
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: arcia
spec:
  replicas: 1
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      containers:
      - name: open-webui
        image: ghcr.io/open-webui/open-webui:main
        ports:
        - containerPort: 8080
        env:
        - name: WEBUI_NAME
          value: "ArcIA"
        - name: CUSTOM_NAME
          value: "ArcIA"
        - name: WEBUI_THEME
          value: "dark"
        - name: WEBUI_BANNERS
          value: '[{"id":"arcia-brand","type":"info","title":"ArcIA Enterprise Agentic Platform","content":"Plateforme IA Agentique Souveraine d''Entreprise","dismissible":true}]'
        - name: CUSTOM_CSS
          value: |
            :root {
              --color-primary: #1659e4;
              --color-primary-dark: #0c2762;
              --color-primary-light: #6be7dd;
            }
            body, .dark body {
              background-color: #050712 !important;
              color: #f8fafc !important;
            }
            .dark #sidebar, .dark .sidebar {
              background-color: #0a0f1d !important;
              border-right: 1px solid #1e293b !important;
            }
            .dark .bg-gray-900, .dark .bg-gray-950, .dark .bg-gray-850 {
              background-color: #0a0f1d !important;
            }
            .dark .bg-gray-800, .dark .bg-gray-700 {
              background-color: #131b2e !important;
              border-color: #1e293b !important;
            }
            .dark .bg-emerald-600, .dark .bg-emerald-700, .dark .bg-blue-600, .dark .bg-primary-600 {
              background: linear-gradient(135deg, #1659e4, #5ad8ce) !important;
              color: #ffffff !important;
              border: none !important;
            }
            *:focus-visible {
              outline: 2px solid #6be7dd !important;
            }
        - name: ENABLE_PERSISTENT_CONFIG
          value: "false"
        - name: BYPASS_MODEL_ACCESS_CONTROL
          value: "true"
        - name: DEFAULT_USER_ROLE
          value: "user"
        - name: OPENAI_API_BASE_URLS
          value: "http://litellm-proxy.arcia.svc:4000/v1;http://hermes-studio.arcia.svc:8642/v1"
        - name: OPENAI_API_KEYS
          value: "sk-arcia;admin"
        - name: OPENAI_API_BASE_URL
          value: "http://litellm-proxy.arcia.svc:4000/v1"
        - name: OPENAI_API_KEY
          value: "sk-arcia"
        - name: ENABLE_OLLAMA_API
          value: "false"
        - name: ENABLE_OPENAI_API
          value: "true"
        - name: DEFAULT_MODELS
          value: "auto"
        - name: TASK_MODEL
          value: "auto"
        - name: ENABLE_SUBAGENTS
          value: "true"
        - name: ENABLE_DIRECT_CONNECTIONS
          value: "true"
        - name: ENABLE_OAUTH_SIGNUP
          value: "true"
        - name: OAUTH_MERGE_ACCOUNTS_BY_EMAIL
          value: "true"
        - name: OAUTH_PROVIDER_NAME
          value: "Microsoft Entra ID"
        - name: ENTRA_TENANT_ID
          valueFrom:
            secretKeyRef:
              name: entraid-secret
              key: tenant-id
        - name: OAUTH_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: entraid-secret
              key: client-id
        - name: OAUTH_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: entraid-secret
              key: client-secret
        - name: OPENID_PROVIDER_URL
          value: "https://login.microsoftonline.com/$(ENTRA_TENANT_ID)/v2.0/.well-known/openid-configuration"
        volumeMounts:
        - name: webui-data
          mountPath: /app/backend/data
      volumes:
      - name: webui-data
        persistentVolumeClaim:
          claimName: open-webui-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: open-webui
  namespace: arcia
spec:
  selector:
    app: open-webui
  ports:
  - port: 8080
    targetPort: 8080
