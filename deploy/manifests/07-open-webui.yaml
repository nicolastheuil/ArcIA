apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: open-webui-pvc
  namespace: arcia
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: arcia
spec:
  replicas: 1
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      containers:
      - name: open-webui
        image: ghcr.io/open-webui/open-webui:main
        ports:
        - containerPort: 8080
        env:
        - name: WEBUI_NAME
          value: "ArcIA"
        - name: WEBUI_THEME
          value: "dark"
        - name: WEBUI_BANNERS
          value: '[{"id":"arcia-brand","type":"info","title":"⚡ ArcIA — Enterprise Agentic Platform","content":"Plateforme IA Agentique Souveraine d''Entreprise • Hermes Agent & LiteLLM","dismissible":true}]'
        - name: WEBUI_AUTH
          value: "true"
        - name: ENABLE_SIGNUP
          value: "false"
        - name: DEFAULT_USER_ROLE
          value: "user"
        - name: BYPASS_MODEL_ACCESS_CONTROL
          value: "false"
        - name: ENABLE_PERSISTENT_CONFIG
          value: "false"
        - name: OPENAI_API_BASE_URLS
          value: "http://litellm-proxy.arcia.svc:4000/v1"
        - name: OPENAI_API_KEYS
          valueFrom:
            secretKeyRef:
              name: litellm-secret
              key: master-key
        - name: OPENAI_API_BASE_URL
          value: "http://litellm-proxy.arcia.svc:4000/v1"
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: litellm-secret
              key: master-key
        - name: ENABLE_OLLAMA_API
          value: "false"
        - name: ENABLE_OPENAI_API
          value: "true"
        - name: DEFAULT_MODELS
          value: "arcia/standard"
        - name: TASK_MODEL
          value: "arcia/standard"
        - name: ENABLE_SUBAGENTS
          value: "true"
        - name: ENABLE_DIRECT_CONNECTIONS
          value: "false"
        - name: ENABLE_FORWARD_USER_INFO_HEADERS
          value: "true"
        - name: ENABLE_OAUTH_SIGNUP
          value: "true"
        - name: OAUTH_MERGE_ACCOUNTS_BY_EMAIL
          value: "false"
        - name: OAUTH_PROVIDER_NAME
          value: "Microsoft Entra ID"
        - name: ENTRA_TENANT_ID
          valueFrom:
            secretKeyRef:
              name: entraid-secret
              key: tenant-id
        - name: OAUTH_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: entraid-secret
              key: client-id
        - name: OAUTH_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: entraid-secret
              key: client-secret
        - name: OPENID_PROVIDER_URL
          value: "https://login.microsoftonline.com/$(ENTRA_TENANT_ID)/v2.0/.well-known/openid-configuration"
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 2Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
        volumeMounts:
        - name: webui-data
          mountPath: /app/backend/data
        - name: arcia-branding
          mountPath: /app/build/static/favicon.svg
          subPath: favicon.svg
        - name: arcia-branding
          mountPath: /app/build/static/logo.svg
          subPath: logo.svg
        - name: arcia-branding
          mountPath: /app/build/static/custom.css
          subPath: custom.css
        - name: arcia-branding
          mountPath: /app/build/static/loader.js
          subPath: loader.js
      volumes:
      - name: webui-data
        persistentVolumeClaim:
          claimName: open-webui-pvc
      - name: arcia-branding
        configMap:
          name: arcia-webui-branding
          optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: open-webui
  namespace: arcia
spec:
  selector:
    app: open-webui
  ports:
  - port: 8080
    targetPort: 8080
