apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: open-webui-pvc
  namespace: arcia
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: arcia
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
      annotations:
        checksum/arcia-webui-branding: "default"
    spec:
      containers:
      - name: open-webui
        command: ["python3", "/opt/arcia-webui/start.py"]
        image: ghcr.io/open-webui/open-webui:v0.12.3
        ports:
        - containerPort: 8080
        env:
        - name: WEBUI_NAME
          value: "ArcIA"
        - name: WEBUI_THEME
          value: "dark"
        - name: ENABLE_VERSION_UPDATE_CHECK
          value: "false"
        - name: WEBUI_SECRET_KEY_FILE
          value: "/app/backend/data/.webui_secret_key"
        - name: WEBUI_BANNERS
          value: '[{"id":"arcia-brand","type":"info","title":"ArcIA Enterprise Agentic Platform","content":"Plateforme IA Agentique Souveraine d\u0027Entreprise - Hermes Agent & LiteLLM","dismissible":true,"timestamp":1700000000}]'
        - name: WEBUI_AUTH
          value: "true"
        - name: ENABLE_SIGNUP
          value: "false"
        - name: DEFAULT_USER_ROLE
          value: "user"
        - name: BYPASS_MODEL_ACCESS_CONTROL
          value: "false"
        - name: ENABLE_PERSISTENT_CONFIG
          value: "false"
        - name: ARCIA_HERMES_FILES_ENABLED
          value: "true"
        - name: LITELLM_MASTER_KEY
          valueFrom:
            secretKeyRef:
              name: litellm-secret
              key: master-key
        - name: OPENAI_API_BASE_URLS
          value: "http://litellm-proxy.arcia.svc:4000/v1;http://127.0.0.1:8080/api/v1/arcia/hermes/v1"
        - name: OPENAI_API_KEYS
          value: "$(LITELLM_MASTER_KEY);__ARCIA_HERMES_FILES_KEY__"
        - name: OPENAI_API_BASE_URL
          value: "http://litellm-proxy.arcia.svc:4000/v1"
        - name: OPENAI_API_KEY
          value: "$(LITELLM_MASTER_KEY)"
        - name: ENABLE_OLLAMA_API
          value: "false"
        - name: ENABLE_OPENAI_API
          value: "true"
        - name: OPENAI_API_CONFIGS
          value: '{"0":{"enable":true,"model_ids":["simple/auto","simple/free"]},"1":{"enable":true,"model_ids":["agentic/auto","agentic/free","agentic/expert"]}}'
        - name: DEFAULT_MODELS
          value: "simple/auto"
        - name: TASK_MODEL
          value: "simple/auto"
        - name: ENABLE_COMMUNITY_SHARING
          value: "false"
        - name: ENABLE_SUBAGENTS
          value: "true"
        - name: ENABLE_DIRECT_CONNECTIONS
          value: "false"
        - name: ENABLE_FORWARD_USER_INFO_HEADERS
          value: "true"
        - name: ENABLE_OAUTH_SIGNUP
          value: "true"
        - name: OAUTH_MERGE_ACCOUNTS_BY_EMAIL
          value: "true"
        - name: OAUTH_PROVIDER_NAME
          value: "Microsoft Entra ID"
        - name: ENTRA_TENANT_ID
          valueFrom:
            secretKeyRef:
              name: entraid-secret
              key: tenant-id
        - name: OAUTH_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: entraid-secret
              key: client-id
        - name: OAUTH_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: entraid-secret
              key: client-secret
        - name: OPENID_PROVIDER_URL
          value: "https://login.microsoftonline.com/$(ENTRA_TENANT_ID)/v2.0/.well-known/openid-configuration"
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 2Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
        volumeMounts:
        - name: webui-data
          mountPath: /app/backend/data
        - name: arcia-branding
          mountPath: /app/build/static/favicon.svg
          subPath: favicon.svg
        - name: arcia-branding
          mountPath: /app/build/static/logo.svg
          subPath: logo.svg
        - name: arcia-branding
          mountPath: /app/build/static/custom.css
          subPath: custom.css
        - name: arcia-branding
          mountPath: /app/build/static/loader.js
          subPath: loader.js
        - name: arcia-branding
          mountPath: /app/build/static/icon-model-default.svg
          subPath: icon-model-default.svg
        - name: arcia-branding
          mountPath: /app/build/static/icon-model-local.svg
          subPath: icon-model-local.svg
        - name: arcia-branding
          mountPath: /app/build/static/icon-model-zdr.svg
          subPath: icon-model-zdr.svg
        - name: arcia-branding-private
          mountPath: /etc/arcia
          readOnly: true
        - name: arcia-webui-code
          mountPath: /opt/arcia-webui
          readOnly: true
        - name: hermes-files-bindings
          mountPath: /etc/arcia-hermes-files
          readOnly: true
      volumes:
      - name: webui-data
        persistentVolumeClaim:
          claimName: open-webui-pvc
      - name: arcia-branding
        configMap:
          name: arcia-webui-branding
          optional: true
      - name: arcia-branding-private
        configMap:
          name: arcia-webui-branding
          items:
          - key: models-branding.json
            path: models-branding.json
      - name: arcia-webui-code
        configMap:
          name: arcia-webui-code
      - name: hermes-files-bindings
        secret:
          secretName: arcia-hermes-files-bindings
          optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: open-webui
  namespace: arcia
spec:
  selector:
    app: open-webui
  ports:
  - port: 8080
    targetPort: 8080
