apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: arcia
data:
  config.yaml: |
    model_list:
      # Modèle principal souverain ArcIA : sélection automatique intelligente du meilleur modèle disponible
      - model_name: "ArcIA-Agentic (auto)"
        litellm_params:
          model: openrouter/auto
          api_key: os.environ/OPENROUTER_API_KEY
          fallbacks: ["openrouter/anthropic/claude-3.5-sonnet", "openrouter/openai/gpt-4o"]

      # Modèle d'expertise avancée ArcIA : raisonnement poussé, pilotable par consigne de modèle dans le prompt
      - model_name: "ArcIA-Agentic (expert)"
        litellm_params:
          model: openrouter/anthropic/claude-3.5-sonnet
          api_key: os.environ/OPENROUTER_API_KEY
          fallbacks: ["openrouter/openai/gpt-4o", "openrouter/auto"]

    router_settings:
      model_group_alias:
        "auto": "ArcIA-Agentic (auto)"
        "ArcIA-Agentic": "ArcIA-Agentic (auto)"
        "hermes-agent": "ArcIA-Agentic (auto)"

    guardrails:
      # Anonymisation universelle obligatoire vers le Cloud
      - guardrail_name: "presidio-guard"
        litellm_params:
          guardrail: presidio
          mode: "pre_call"
          default_on: true
          presidio_analyzer_api_base: "http://presidio-dlp:8080"
          presidio_anonymizer_api_base: "http://presidio-dlp:8080"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm-proxy
  namespace: arcia
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm-proxy
  template:
    metadata:
      labels:
        app: litellm-proxy
    spec:
      containers:
      - name: litellm
        image: ghcr.io/berriai/litellm:main-latest
        args:
        - "--config"
        - "/app/config.yaml"
        - "--port"
        - "4000"
        ports:
        - containerPort: 4000
        env:
        - name: LITELLM_DANGEROUSLY_PERMIT_WEAK_OR_UNSET_MASTER_KEY
          value: "true"
        - name: OPENROUTER_API_KEY
          valueFrom:
            secretKeyRef:
              name: enterprise-llm-secret
              key: openrouter-key
        volumeMounts:
        - name: config
          mountPath: /app/config.yaml
          subPath: config.yaml
      volumes:
      - name: config
        configMap:
          name: litellm-config
---
apiVersion: v1
kind: Service
metadata:
  name: litellm-proxy
  namespace: arcia
spec:
  selector:
    app: litellm-proxy
  ports:
  - port: 4000
    targetPort: 4000
