apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: arcia
data:
  config.yaml: |
    model_list:
      # 1. Palier Gratuit : Découverte et qualification sans coût
      - model_name: "arcia/free"
        litellm_params:
          model: openrouter/openrouter/free
          api_key: os.environ/OPENROUTER_API_KEY
          extra_body:
            provider:
              zdr: true

      # 2. Palier Auto (Défaut) : Routage automatique intelligent
      - model_name: "arcia/auto"
        litellm_params:
          model: openrouter/auto
          api_key: os.environ/OPENROUTER_API_KEY
          extra_body:
            provider:
              zdr: true

      # 3. Palier Expert : Raisonnement approfondi et tâches agentiques complexes
      - model_name: "arcia/expert"
        litellm_params:
          model: openrouter/anthropic/claude-3.7-sonnet
          api_key: os.environ/OPENROUTER_API_KEY
          extra_body:
            provider:
              zdr: true

    router_settings:
      fallbacks:
        - "arcia/free": ["arcia/auto"]
        - "arcia/auto": ["arcia/expert"]
        - "arcia/expert": ["arcia/auto"]
      model_group_alias:
        "arcia/standard":
          model: "arcia/auto"
          hidden: true
        "arcia/reasoning":
          model: "arcia/expert"
          hidden: true
        "auto":
          model: "arcia/auto"
          hidden: true
        "hermes-agent":
          model: "arcia/auto"
          hidden: true

    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      database_url: os.environ/DATABASE_URL
      database_connection_pool_limit: 10
      user_header_name: "X-OpenWebUI-User-Email"
      store_model_in_db: true

    litellm_settings:
      drop_params: true

    guardrails:
      # Anonymisation universelle obligatoire et fail-closed vers le Cloud
      - guardrail_name: "presidio-guard"
        litellm_params:
          guardrail: presidio
          mode: "pre_call"
          default_on: true
          presidio_analyzer_api_base: "http://presidio-dlp:8080"
          presidio_anonymizer_api_base: "http://presidio-dlp:8080"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm-proxy
  namespace: arcia
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm-proxy
  template:
    metadata:
      labels:
        app: litellm-proxy
    spec:
      containers:
      - name: litellm
        image: ghcr.io/berriai/litellm:main-v1.72.6-stable@sha256:2c3f50ed1ea59ec9e175711c808c3bf15f023643fe50fb1ba1d0f9dc827a356d
        args:
        - "--config"
        - "/app/config.yaml"
        - "--port"
        - "4000"
        ports:
        - containerPort: 4000
        env:
        - name: LITELLM_MASTER_KEY
          valueFrom:
            secretKeyRef:
              name: litellm-secret
              key: master-key
        - name: LITELLM_SALT_KEY
          valueFrom:
            secretKeyRef:
              name: litellm-secret
              key: salt-key
        - name: LITELLM_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: litellm-secret
              key: db-password
        - name: DATABASE_URL
          value: "postgresql://litellm:$(LITELLM_DB_PASSWORD)@litellm-db.arcia.svc:5432/litellm"
        - name: STORE_MODEL_IN_DB
          value: "True"
        - name: OPENROUTER_API_KEY
          valueFrom:
            secretKeyRef:
              name: enterprise-llm-secret
              key: openrouter-key
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1536Mi
        readinessProbe:
          httpGet:
            path: /health/readiness
            port: 4000
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health/liveness
            port: 4000
          initialDelaySeconds: 20
          periodSeconds: 15
        volumeMounts:
        - name: config
          mountPath: /app/config.yaml
          subPath: config.yaml
      volumes:
      - name: config
        configMap:
          name: litellm-config
---
apiVersion: v1
kind: Service
metadata:
  name: litellm-proxy
  namespace: arcia
spec:
  type: NodePort
  selector:
    app: litellm-proxy
  ports:
  - port: 4000
    targetPort: 4000
    nodePort: 30400
    name: http
