apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: arcia
data:
  config.yaml: |
    model_list:
      # 1. simple/free : direct LiteLLM vers OpenRouter Free
      - model_name: "simple/free"
        litellm_params:
          model: openrouter/openrouter/free
          api_key: os.environ/OPENROUTER_API_KEY
          extra_body:
            provider:
              zdr: true

      # 2. simple/auto : direct LiteLLM vers OpenRouter Auto
      - model_name: "simple/auto"
        litellm_params:
          model: openrouter/auto
          api_key: os.environ/OPENROUTER_API_KEY
          extra_body:
            provider:
              zdr: true

      # 3. openrouter/deepseek/deepseek-v4.1-flash : modèle d'inférence pour l'agent
      - model_name: "openrouter/deepseek/deepseek-v4.1-flash"
        litellm_params:
          model: openrouter/deepseek/deepseek-v4.1-flash
          api_key: os.environ/OPENROUTER_API_KEY
          extra_body:
            provider:
              zdr: true

    router_settings:
      fallbacks:
        - "simple/free": ["simple/auto"]
        - "simple/auto": ["simple/free"]
      model_group_alias:
        "openrouter/free":
          model: "simple/free"
          hidden: true
        "openrouter/auto":
          model: "simple/auto"
          hidden: true
        "openrouter/deepseek-v4.1-flash":
          model: "openrouter/deepseek/deepseek-v4.1-flash"
          hidden: true
        "arcia/free":
          model: "simple/free"
          hidden: true
        "arcia/auto":
          model: "simple/auto"
          hidden: true
        "arcia/expert":
          model: "openrouter/deepseek/deepseek-v4.1-flash"
          hidden: true
        "arcia/standard":
          model: "simple/auto"
          hidden: true
        "arcia/reasoning":
          model: "openrouter/deepseek/deepseek-v4.1-flash"
          hidden: true
        "auto":
          model: "simple/auto"
          hidden: true
        "hermes-agent":
          model: "simple/auto"
          hidden: true

    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      database_url: os.environ/DATABASE_URL
      database_connection_pool_limit: 10
      user_header_name: "X-OpenWebUI-User-Email"
      store_model_in_db: true

    litellm_settings:
      drop_params: true

    guardrails:
      # Anonymisation universelle obligatoire et fail-closed vers le Cloud
      - guardrail_name: "presidio-guard"
        litellm_params:
          guardrail: presidio
          mode: "pre_call"
          default_on: true
          presidio_analyzer_api_base: "http://presidio-dlp:8080"
          presidio_anonymizer_api_base: "http://presidio-dlp:8080"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm-proxy
  namespace: arcia
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm-proxy
  template:
    metadata:
      labels:
        app: litellm-proxy
    spec:
      containers:
      - name: litellm
        image: ghcr.io/berriai/litellm:main-v1.72.6-stable@sha256:2c3f50ed1ea59ec9e175711c808c3bf15f023643fe50fb1ba1d0f9dc827a356d
        args:
        - "--config"
        - "/app/config.yaml"
        - "--port"
        - "4000"
        ports:
        - containerPort: 4000
        env:
        - name: LITELLM_MASTER_KEY
          valueFrom:
            secretKeyRef:
              name: litellm-secret
              key: master-key
        - name: LITELLM_SALT_KEY
          valueFrom:
            secretKeyRef:
              name: litellm-secret
              key: salt-key
        - name: LITELLM_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: litellm-secret
              key: db-password
        - name: DATABASE_URL
          value: "postgresql://litellm:$(LITELLM_DB_PASSWORD)@litellm-db.arcia.svc:5432/litellm"
        - name: STORE_MODEL_IN_DB
          value: "True"
        - name: OPENROUTER_API_KEY
          valueFrom:
            secretKeyRef:
              name: enterprise-llm-secret
              key: openrouter-key
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1536Mi
        readinessProbe:
          httpGet:
            path: /health/readiness
            port: 4000
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health/liveness
            port: 4000
          initialDelaySeconds: 20
          periodSeconds: 15
        lifecycle:
          postStart:
            exec:
              command:
              - /bin/sh
              - -c
              - |
                python3 -c '
                import urllib.request, json, os, time
                time.sleep(5)
                k = os.environ.get("LITELLM_MASTER_KEY")
                payload = json.dumps({"key": "sk-arcia-openwebui-direct-token", "key_alias": "openwebui-frontend-token", "models": ["simple/free", "simple/auto"]}).encode()
                req = urllib.request.Request("http://localhost:4000/key/generate", data=payload, headers={"Authorization": f"Bearer {k}", "Content-Type": "application/json"})
                try: urllib.request.urlopen(req)
                except Exception: pass
                ' &
        volumeMounts:
        - name: config
          mountPath: /app/config.yaml
          subPath: config.yaml
      volumes:
      - name: config
        configMap:
          name: litellm-config
---
apiVersion: v1
kind: Service
metadata:
  name: litellm-proxy
  namespace: arcia
spec:
  type: NodePort
  selector:
    app: litellm-proxy
  ports:
  - port: 4000
    targetPort: 4000
    nodePort: 30400
    name: http
