apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: arcia
data:
  config.yaml: |
    model_list:
      # Modèle 'auto' d'entreprise routé sur OpenRouter avec failover
      - model_name: auto
        litellm_params:
          model: openrouter/auto
          api_key: os.environ/OPENROUTER_API_KEY
          fallbacks: ["openrouter/anthropic/claude-3.5-sonnet", "openrouter/openai/gpt-4o"]
      
      # Modèles Cloud d'Entreprise exposés nativement
      - model_name: claude-3.5-sonnet
        litellm_params:
          model: openrouter/anthropic/claude-3.5-sonnet
          api_key: os.environ/OPENROUTER_API_KEY

      - model_name: gpt-4o
        litellm_params:
          model: openrouter/openai/gpt-4o
          api_key: os.environ/OPENROUTER_API_KEY

      - model_name: deepseek-chat
        litellm_params:
          model: openrouter/deepseek/deepseek-chat
          api_key: os.environ/OPENROUTER_API_KEY

      - model_name: hermes-agent
        litellm_params:
          model: openrouter/anthropic/claude-3.5-sonnet
          api_key: os.environ/OPENROUTER_API_KEY

      # Modèle interne d'entreprise souverain (vLLM local)
      - model_name: local-internal
        litellm_params:
          model: openai/hermes-3-70b
          api_base: http://vllm-internal.corp.local:8000/v1
          api_key: "none"

    guardrails:
      # Anonymisation universelle obligatoire vers le Cloud
      - guardrail_name: "presidio-guard"
        litellm_params:
          guardrail: presidio
          mode: "pre_call"
          default_on: true
          presidio_analyzer_api_base: "http://presidio-dlp:8080"
          presidio_anonymizer_api_base: "http://presidio-dlp:8080"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm-proxy
  namespace: arcia
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm-proxy
  template:
    metadata:
      labels:
        app: litellm-proxy
    spec:
      containers:
      - name: litellm
        image: ghcr.io/berriai/litellm:main-latest
        args:
        - "--config"
        - "/app/config.yaml"
        - "--port"
        - "4000"
        ports:
        - containerPort: 4000
        env:
        - name: LITELLM_DANGEROUSLY_PERMIT_WEAK_OR_UNSET_MASTER_KEY
          value: "true"
        - name: OPENROUTER_API_KEY
          valueFrom:
            secretKeyRef:
              name: enterprise-llm-secret
              key: openrouter-key
        volumeMounts:
        - name: config
          mountPath: /app/config.yaml
          subPath: config.yaml
      volumes:
      - name: config
        configMap:
          name: litellm-config
---
apiVersion: v1
kind: Service
metadata:
  name: litellm-proxy
  namespace: arcia
spec:
  selector:
    app: litellm-proxy
  ports:
  - port: 4000
    targetPort: 4000
