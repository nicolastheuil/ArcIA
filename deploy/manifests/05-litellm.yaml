# ==============================================================================
# ArcIA v0.7.0 — LiteLLM Proxy (Passerelle d'Inférence Unifiée & Guardrail Presidio)
# Catalogue canonique :
#   - Direct LiteLLM : simple/free, simple/auto
#   - Moteur Hermes  : agentic/free, agentic/auto, agentic/expert
# ==============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: arcia
data:
  config.yaml: |
    model_list:
      # 1. simple/free : direct LiteLLM vers OpenRouter Free (0 €)
      - model_name: "simple/free"
        litellm_params:
          model: openrouter/openrouter/free
          api_key: os.environ/OPENROUTER_API_KEY
          extra_body:
            provider:
              data_collection: "deny"
              zdr: true
              allow_fallbacks: false

      # 2. simple/auto : direct LiteLLM vers OpenRouter Auto (Défaut rapide)
      - model_name: "simple/auto"
        litellm_params:
          model: openrouter/auto
          api_key: os.environ/OPENROUTER_API_KEY
          extra_body:
            provider:
              data_collection: "deny"
              zdr: true
              allow_fallbacks: false

      # 3. agentic/expert : modèle haute précision pour l'orchestration agentique Hermes
      - model_name: "agentic/expert"
        litellm_params:
          model: openrouter/deepseek/deepseek-chat
          api_key: os.environ/OPENROUTER_API_KEY
          extra_body:
            provider:
              data_collection: "deny"
              zdr: true
              allow_fallbacks: false

    router_settings:
      fallbacks:
        - "simple/auto": ["simple/free"]
        - "agentic/expert": ["simple/auto"]
      model_group_alias:
        "agentic/free":
          model: "simple/free"
          hidden: true
        "agentic/auto":
          model: "simple/auto"
          hidden: true

    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      salt_key: os.environ/LITELLM_SALT_KEY
      database_url: os.environ/DATABASE_URL
      database_connection_pool_limit: 10
      user_header_name: "X-OpenWebUI-User-Email"
      store_model_in_db: true

    litellm_settings:
      drop_params: true
      callbacks: error_handler.proxy_handler_instance
      request_timeout: 20
      num_retries: 1

    guardrails:
      # Barrière 2 DLP : Anonymisation universelle obligatoire et fail-closed vers le Cloud
      - guardrail_name: "presidio-guard"
        litellm_params:
          guardrail: presidio
          mode: "pre_call"
          default_on: true
          # Une politique explicite active le refus des réponses Presidio invalides
          # dans LiteLLM 1.106.0 ; sans elle un HTTP 422 devient une analyse vide.
          timeout: 5
          pii_entities_config:
            EMAIL_ADDRESS: MASK
          presidio_analyzer_api_base: "http://presidio-dlp:8080"
          presidio_anonymizer_api_base: "http://presidio-dlp:8080"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm-proxy
  namespace: arcia
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm-proxy
  template:
    metadata:
      labels:
        app: litellm-proxy
      annotations:
        checksum/litellm-error-handler: "default"
        checksum/litellm-config: "default"
        checksum/litellm-secret: "default"
    spec:
      containers:
      - name: litellm
        image: ghcr.io/berriai/litellm:v1.106.0@sha256:2e4c0371f3a8c28e4da131d77abaa8341cd3b0c2fcc4d34d7c5900431af7b9d0
        args:
        - "--config"
        - "/app/config.yaml"
        - "--port"
        - "4000"
        ports:
        - containerPort: 4000
        env:
        - name: OPENROUTER_API_KEY
          valueFrom:
            secretKeyRef:
              name: litellm-secret
              key: openrouter-key
        - name: LITELLM_MASTER_KEY
          valueFrom:
            secretKeyRef:
              name: litellm-secret
              key: master-key
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: litellm-secret
              key: openai-key
              optional: true
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: litellm-secret
              key: anthropic-key
              optional: true
        - name: MISTRAL_API_KEY
          valueFrom:
            secretKeyRef:
              name: litellm-secret
              key: mistral-key
              optional: true
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: litellm-secret
              key: gemini-key
              optional: true
        - name: LITELLM_SALT_KEY
          valueFrom:
            secretKeyRef:
              name: litellm-secret
              key: salt-key
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: litellm-secret
              key: database-url
        - name: STORE_MODEL_IN_DB
          value: "True"
        - name: PRESIDIO_ANALYZER_API_BASE
          value: "http://presidio-dlp.arcia.svc:8080"
        - name: PRESIDIO_ANONYMIZER_API_BASE
          value: "http://presidio-dlp.arcia.svc:8080"
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1536Mi
        livenessProbe:
          httpGet:
            path: /health/liveliness
            port: 4000
          initialDelaySeconds: 40
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health/liveliness
            port: 4000
          initialDelaySeconds: 20
          periodSeconds: 10
        volumeMounts:
        - name: config
          mountPath: /app/config.yaml
          subPath: config.yaml
        - name: error-handler
          mountPath: /app/error_handler.py
          subPath: error_handler.py
      volumes:
      - name: config
        configMap:
          name: litellm-config
      - name: error-handler
        configMap:
          name: litellm-error-handler
---
apiVersion: v1
kind: Service
metadata:
  name: litellm-proxy
  namespace: arcia
spec:
  type: NodePort
  selector:
    app: litellm-proxy
  ports:
  - port: 4000
    targetPort: 4000
    nodePort: 30400
    name: http
