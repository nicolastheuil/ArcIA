apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-plugin-code
  namespace: arcia
data:
  arcia_tokenmaxing.py: |
    import os
    import json
    import subprocess
    from typing import Any, Dict

    MAX_JSON_BYTES = 8192

    def compress_shell_output(command: str, output: str) -> str:
        if not output:
            return output
        if os.path.exists("/usr/local/bin/rtk"):
            try:
                proc = subprocess.run(
                    ["/usr/local/bin/rtk", "compress"],
                    input=output.encode("utf-8"),
                    capture_output=True,
                    timeout=5
                )
                if proc.returncode == 0 and proc.stdout:
                    return proc.stdout.decode("utf-8")
            except Exception:
                pass
        if "git log" in command and len(output.splitlines()) > 50:
            lines = output.splitlines()
            head = lines[:30]
            tail = lines[-10:]
            return "\n".join(head) + f"\n\n[... {len(lines) - 40} lines truncated by ArcIA Tokenmaxing ...]\n\n" + "\n".join(tail)
        return output

    def compress_large_json(raw_text: str) -> str:
        if len(raw_text.encode("utf-8")) <= MAX_JSON_BYTES:
            return raw_text
        try:
            data = json.loads(raw_text)
            if isinstance(data, list) and len(data) > 20:
                sample = data[:10]
                summary = {
                    "_arcia_tokenmaxing": f"List truncated: showing 10 of {len(data)} items",
                    "sample": sample,
                    "total_items": len(data)
                }
                return json.dumps(summary, indent=2)
            elif isinstance(data, dict):
                truncated = {}
                for k, v in data.items():
                    if isinstance(v, (dict, list)) and len(str(v)) > 1024:
                        truncated[k] = f"[Truncated container: {type(v).__name__} with size {len(v)}]"
                    else:
                        truncated[k] = v
                truncated["_arcia_tokenmaxing"] = "Large JSON keys pruned to stay within context budget"
                return json.dumps(truncated, indent=2)
        except Exception:
            pass
        return raw_text

    def on_tool_result(tool_name: str, command: str, result: str) -> str:
        if tool_name in ["terminal", "bash", "exec"]:
            return compress_shell_output(command, result)
        if tool_name in ["read_file", "fetch_url", "http"]:
            return compress_large_json(result)
        return result
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-user-pvc
  namespace: arcia
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-agent
  namespace: arcia
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hermes-agent
  template:
    metadata:
      labels:
        app: hermes-agent
    spec:
      securityContext:
        fsGroup: 10000
      initContainers:
      - name: init-permissions
        image: docker.io/arcia/hermes-agent:v0.2
        command: ["/bin/sh", "-c", "chown -R 10000:10000 /opt/data"]
        securityContext:
          runAsUser: 0
        volumeMounts:
        - name: user-state
          mountPath: /opt/data
      containers:
      - name: hermes
        image: docker.io/arcia/hermes-agent:v0.2
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - |
          mkdir -p /opt/data
          # Démarrage de la Gateway API (port 8642) en arrière-plan pour Hermes Desktop
          hermes serve --host 0.0.0.0 --port 8642 --skip-build &
          # Démarrage du Studio Dashboard (port 9119) au premier plan pour le pilotage Kanban
          exec hermes dashboard --host 0.0.0.0 --port 9119 --skip-build --no-open
        ports:
        - containerPort: 9119
          name: studio
        - containerPort: 8642
          name: gateway
        env:
        - name: API_SERVER_ENABLED
          value: "true"
        - name: API_SERVER_KEY
          valueFrom:
            secretKeyRef:
              name: hermes-gateway-secret
              key: api-server-key
        - name: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
          value: "admin"
        - name: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
          valueFrom:
            secretKeyRef:
              name: hermes-gateway-secret
              key: api-server-key
        - name: HERMES_DASHBOARD_BASIC_AUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: hermes-gateway-secret
              key: api-server-key
        - name: OPENAI_API_BASE
          value: "http://litellm-proxy.arcia.svc:4000/v1"
        - name: OPENAI_MODEL_NAME
          value: "auto"
        volumeMounts:
        - name: user-state
          mountPath: /opt/data
        - name: shared-skills
          mountPath: /opt/shared-skills
          readOnly: true
        - name: tokenmaxing-plugin
          mountPath: /opt/hermes/plugins/arcia_tokenmaxing.py
          subPath: arcia_tokenmaxing.py
      volumes:
      - name: user-state
        persistentVolumeClaim:
          claimName: hermes-user-pvc
      - name: shared-skills
        hostPath:
          path: /var/data/arcia/shared-skills
          type: DirectoryOrCreate
      - name: tokenmaxing-plugin
        configMap:
          name: hermes-plugin-code
---
apiVersion: v1
kind: Service
metadata:
  name: hermes-studio
  namespace: arcia
spec:
  selector:
    app: hermes-agent
  ports:
  - port: 9119
    targetPort: 9119
    name: studio
  - port: 8642
    targetPort: 8642
    name: gateway
