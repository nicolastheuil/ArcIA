# ==============================================================================
# ArcIA v0.3 — Hermes Agent Runtime & Studio Dashboard
# ==============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-config
  namespace: arcia
data:
  config.yaml: |
    model:
      provider: custom
      base_url: http://litellm-proxy.arcia.svc:4000/v1
      default: simple/auto
      key_env: OPENAI_API_KEY
    approvals:
      mode: smart
      unattended_mode: approve
    skills:
      external_dirs:
        - /opt/data/skills
        - /opt/data/shared-skills/arcia
    agent:
      max_turns: 30
    platforms:
      api_server:
        direct_model_requests: true
        model_name: "agentic/auto"
        model_routes:
          agentic/free:
            model: "simple/free"
          agentic/auto:
            model: "simple/auto"
          agentic/deepseek-v4.1-flash:
            model: "openrouter/deepseek/deepseek-v4.1-flash"
          arcia/free:
            model: "simple/free"
          arcia/auto:
            model: "simple/auto"
          arcia/expert:
            model: "openrouter/deepseek/deepseek-v4.1-flash"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-user-pvc
  namespace: arcia
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-agent
  namespace: arcia
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hermes-agent
  template:
    metadata:
      labels:
        app: hermes-agent
    spec:
      securityContext:
        fsGroup: 10000
      initContainers:
      - name: init-config-and-perms
        image: nousresearch/hermes-agent:latest
        command:
        - /bin/sh
        - -c
        - |
          mkdir -p /opt/data/.hermes /opt/data/skills/public-apis/scripts /opt/data/skills/ponytail /opt/data/skills/graphify /opt/data/shared-skills/arcia/ponytail /opt/data/shared-skills/arcia/graphify /opt/data/shared-skills/arcia/public-apis/scripts
          cp /etc/hermes/config.yaml /opt/data/config.yaml
          cp /etc/hermes/config.yaml /opt/data/.hermes/config.yaml
          if [ -d /opt/native-skills-cm ]; then
            [ -f /opt/native-skills-cm/ponytail-skill.md ] && cp /opt/native-skills-cm/ponytail-skill.md /opt/data/skills/ponytail/SKILL.md && cp /opt/native-skills-cm/ponytail-skill.md /opt/data/shared-skills/arcia/ponytail/SKILL.md
            [ -f /opt/native-skills-cm/graphify-skill.md ] && cp /opt/native-skills-cm/graphify-skill.md /opt/data/skills/graphify/SKILL.md && cp /opt/native-skills-cm/graphify-skill.md /opt/data/shared-skills/arcia/graphify/SKILL.md
            [ -f /opt/native-skills-cm/public-apis-skill.md ] && cp /opt/native-skills-cm/public-apis-skill.md /opt/data/skills/public-apis/SKILL.md && cp /opt/native-skills-cm/public-apis-skill.md /opt/data/shared-skills/arcia/public-apis/SKILL.md
            [ -f /opt/native-skills-cm/public-apis-script.py ] && cp /opt/native-skills-cm/public-apis-script.py /opt/data/skills/public-apis/scripts/public_apis.py && cp /opt/native-skills-cm/public-apis-script.py /opt/data/shared-skills/arcia/public-apis/scripts/public_apis.py && chmod +x /opt/data/skills/public-apis/scripts/public_apis.py /opt/data/shared-skills/arcia/public-apis/scripts/public_apis.py
            [ -f /opt/native-skills-cm/public-apis-catalog.json ] && cp /opt/native-skills-cm/public-apis-catalog.json /opt/data/skills/public-apis/catalog.json && cp /opt/native-skills-cm/public-apis-catalog.json /opt/data/shared-skills/arcia/public-apis/catalog.json
          fi
          chown -R 10000:10000 /opt/data
        securityContext:
          runAsUser: 0
        volumeMounts:
        - name: user-state
          mountPath: /opt/data
        - name: hermes-cfg
          mountPath: /etc/hermes
        - name: native-skills
          mountPath: /opt/native-skills-cm
      containers:
      - name: hermes
        image: nousresearch/hermes-agent:latest
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - |
          mkdir -p /opt/data/.hermes $HOME/.hermes /opt/data/skills
          cp /opt/data/config.yaml $HOME/.hermes/config.yaml 2>/dev/null || true
          mkdir -p /opt/shared-skills/arcia 2>/dev/null || true
          ln -sfn /opt/data/skills/public-apis /opt/shared-skills/arcia/public-apis 2>/dev/null || true
          ln -sfn /opt/data/skills/ponytail /opt/shared-skills/arcia/ponytail 2>/dev/null || true
          ln -sfn /opt/data/skills/graphify /opt/shared-skills/arcia/graphify 2>/dev/null || true
          python3 -c 'p="/opt/hermes/gateway/platforms/api_server.py"; s=open(p).read(); s=s.replace("(\"GET\", \"/health\", self._handle_health),", "(\"GET\", \"/health\", self._handle_health),\n            (\"GET\", \"/\", self._handle_health),"); open(p,"w").write(s)' 2>/dev/null || true
          hermes gateway &
          exec hermes dashboard --host 0.0.0.0 --port 9119 --skip-build --no-open
        ports:
        - containerPort: 9119
          name: studio
        - containerPort: 8642
          name: gateway
        env:
        - name: HERMES_DASHBOARD_PUBLIC_URL
          value: "https://assistant.example.org/studio"
        - name: API_SERVER_ENABLED
          value: "true"
        - name: API_SERVER_HOST
          value: "0.0.0.0"
        - name: API_SERVER_PORT
          value: "8642"
        - name: API_SERVER_KEY
          valueFrom:
            secretKeyRef:
              name: hermes-gateway-secret
              key: api-server-key
        - name: HERMES_HOME
          value: "/opt/data"
        - name: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
          value: "admin"
        - name: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
          valueFrom:
            secretKeyRef:
              name: hermes-gateway-secret
              key: admin-password
        - name: HERMES_DASHBOARD_BASIC_AUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: hermes-gateway-secret
              key: api-server-key
        - name: OPENAI_BASE_URL
          value: "http://litellm-proxy.arcia.svc:4000/v1"
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: litellm-secret
              key: master-key
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1500m
            memory: 2Gi
        readinessProbe:
          httpGet:
            path: /api/health
            port: 9119
          initialDelaySeconds: 20
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /api/health
            port: 9119
          initialDelaySeconds: 30
          periodSeconds: 20
        volumeMounts:
        - name: user-state
          mountPath: /opt/data
      volumes:
      - name: user-state
        persistentVolumeClaim:
          claimName: hermes-user-pvc
      - name: hermes-cfg
        configMap:
          name: hermes-config
      - name: native-skills
        configMap:
          name: arcia-native-skills
          optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: hermes-studio
  namespace: arcia
spec:
  selector:
    app: hermes-agent
  ports:
  - port: 9119
    targetPort: 9119
    name: studio
  - port: 8642
    targetPort: 8642
    name: gateway
