# ==============================================================================
# ArcIA v0.5.2 — Hermes Agent Runtime, Tokenmaxing (CCR/RTK/Graphify/Ponytail) & Studio
# ==============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-config
  namespace: arcia
data:
  config.yaml: |
    model:
      provider: custom
      base_url: http://litellm-proxy.arcia.svc:4000/v1
      default: agentic/auto
      key_env: OPENAI_API_KEY
    providers:
      custom:
        name: "ArcIA Agentic"
        base_url: http://litellm-proxy.arcia.svc:4000/v1
        key_env: OPENAI_API_KEY
        discover_models: false
        models:
          - agentic/free
          - agentic/auto
          - agentic/expert
    approvals:
      mode: smart
      unattended_mode: approve
    skills:
      external_dirs:
        - /opt/data/skills
        - /opt/data/shared-skills/arcia
    agent:
      max_turns: 30
    platforms:
      api_server:
        direct_model_requests: true
        model_name: "agentic/auto"
        model_routes:
          agentic/free:
            model: "simple/free"
          agentic/auto:
            model: "simple/auto"
          agentic/expert:
            model: "agentic/expert"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-user-pvc
  namespace: arcia
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-agent
  namespace: arcia
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hermes-agent
  template:
    metadata:
      labels:
        app: hermes-agent
      annotations:
        checksum/hermes-config: "default"
    spec:
      securityContext:
        fsGroup: 10000
      initContainers:
      - name: init-config-and-perms
        image: nousresearch/hermes-agent:v0.22.2
        command:
        - /bin/sh
        - -c
        - |
          mkdir -p /opt/data/.hermes /opt/data/.ccr_cache /opt/data/bin /opt/data/plugins /opt/data/skills/public-apis/scripts /opt/data/skills/ponytail /opt/data/skills/graphify /opt/data/shared-skills/arcia/ponytail /opt/data/shared-skills/arcia/graphify /opt/data/shared-skills/arcia/public-apis/scripts
          cp /etc/hermes/config.yaml /opt/data/config.yaml
          cp /etc/hermes/config.yaml /opt/data/.hermes/config.yaml
          if [ -f /opt/governance-plugin-cm/plugin.py ]; then
            cp /opt/governance-plugin-cm/plugin.py /opt/data/plugins/plugin.py
            chmod +x /opt/data/plugins/plugin.py
          fi
          if [ -d /opt/native-skills-cm ]; then
            [ -f /opt/native-skills-cm/ponytail-skill.md ] && cp /opt/native-skills-cm/ponytail-skill.md /opt/data/skills/ponytail/SKILL.md && cp /opt/native-skills-cm/ponytail-skill.md /opt/data/shared-skills/arcia/ponytail/SKILL.md
            [ -f /opt/native-skills-cm/graphify-skill.md ] && cp /opt/native-skills-cm/graphify-skill.md /opt/data/skills/graphify/SKILL.md && cp /opt/native-skills-cm/graphify-skill.md /opt/data/shared-skills/arcia/graphify/SKILL.md
            [ -f /opt/native-skills-cm/public-apis-skill.md ] && cp /opt/native-skills-cm/public-apis-skill.md /opt/data/skills/public-apis/SKILL.md && cp /opt/native-skills-cm/public-apis-skill.md /opt/data/shared-skills/arcia/public-apis/SKILL.md
            [ -f /opt/native-skills-cm/public-apis-script.py ] && cp /opt/native-skills-cm/public-apis-script.py /opt/data/skills/public-apis/scripts/public_apis.py && cp /opt/native-skills-cm/public-apis-script.py /opt/data/shared-skills/arcia/public-apis/scripts/public_apis.py && chmod +x /opt/data/skills/public-apis/scripts/public_apis.py /opt/data/shared-skills/arcia/public-apis/scripts/public_apis.py
            [ -f /opt/native-skills-cm/public-apis-catalog.json ] && cp /opt/native-skills-cm/public-apis-catalog.json /opt/data/skills/public-apis/catalog.json && cp /opt/native-skills-cm/public-apis-catalog.json /opt/data/shared-skills/arcia/public-apis/catalog.json
          fi
          chown -R 10000:10000 /opt/data
        securityContext:
          runAsUser: 0
        volumeMounts:
        - name: user-state
          mountPath: /opt/data
        - name: hermes-cfg
          mountPath: /etc/hermes
        - name: native-skills
          mountPath: /opt/native-skills-cm
        - name: governance-plugin
          mountPath: /opt/governance-plugin-cm
      containers:
      - name: hermes
        image: nousresearch/hermes-agent:v0.22.2
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - |
          mkdir -p /opt/data/.hermes $HOME/.hermes /opt/data/skills /opt/hermes/plugins $HOME/.hermes/plugins/arcia_governance
          cp /opt/data/config.yaml $HOME/.hermes/config.yaml 2>/dev/null || true
          if [ -f /opt/governance-plugin-cm/plugin.py ]; then
            cp /opt/governance-plugin-cm/plugin.py /opt/hermes/plugins/plugin.py 2>/dev/null || true
            cp /opt/governance-plugin-cm/plugin.py $HOME/.hermes/plugins/arcia_governance/plugin.py 2>/dev/null || true
            chmod +x /opt/hermes/plugins/plugin.py $HOME/.hermes/plugins/arcia_governance/plugin.py 2>/dev/null || true
          fi
          mkdir -p /opt/shared-skills/arcia 2>/dev/null || true
          ln -sfn /opt/data/skills/public-apis /opt/shared-skills/arcia/public-apis 2>/dev/null || true
          ln -sfn /opt/data/skills/ponytail /opt/shared-skills/arcia/ponytail 2>/dev/null || true
          ln -sfn /opt/data/skills/graphify /opt/shared-skills/arcia/graphify 2>/dev/null || true
          python3 -c 'p="/opt/hermes/gateway/platforms/api_server.py"; s=open(p).read(); s=s.replace("(\"GET\", \"/health\", self._handle_health),", "(\"GET\", \"/health\", self._handle_health),\n            (\"GET\", \"/\", self._handle_health),"); open(p,"w").write(s)' 2>/dev/null || true
          hermes gateway &
          exec hermes dashboard --host 0.0.0.0 --port 9119 --skip-build --no-open
        ports:
        - containerPort: 9119
          name: studio
        - containerPort: 8642
          name: gateway
        env:
        - name: HERMES_DASHBOARD_PUBLIC_URL
          value: "https://assistant.example.org/studio"
        - name: API_SERVER_ENABLED
          value: "true"
        - name: API_SERVER_HOST
          value: "0.0.0.0"
        - name: API_SERVER_PORT
          value: "8642"
        - name: API_SERVER_KEY
          valueFrom:
            secretKeyRef:
              name: hermes-gateway-secret
              key: api-server-key
        - name: HERMES_HOME
          value: "/opt/data"
        - name: ARCIA_CCR_CACHE_DIR
          value: "/opt/data/.ccr_cache"
        - name: PRESIDIO_DLP_URL
          value: "http://presidio-dlp.arcia.svc:8080/sanitize"
        - name: PRESIDIO_FAIL_CLOSED
          value: "true"
        - name: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
          value: "admin"
        - name: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
          valueFrom:
            secretKeyRef:
              name: hermes-gateway-secret
              key: admin-password
        - name: HERMES_DASHBOARD_BASIC_AUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: hermes-gateway-secret
              key: api-server-key
        - name: OPENAI_BASE_URL
          value: "http://litellm-proxy.arcia.svc:4000/v1"
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: litellm-secret
              key: master-key
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1500m
            memory: 2Gi
        readinessProbe:
          httpGet:
            path: /api/health
            port: 9119
          initialDelaySeconds: 20
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /api/health
            port: 9119
          initialDelaySeconds: 30
          periodSeconds: 20
        volumeMounts:
        - name: user-state
          mountPath: /opt/data
        - name: governance-plugin
          mountPath: /opt/governance-plugin-cm
          readOnly: true
      volumes:
      - name: user-state
        persistentVolumeClaim:
          claimName: hermes-user-pvc
      - name: hermes-cfg
        configMap:
          name: hermes-config
      - name: native-skills
        configMap:
          name: arcia-native-skills
          optional: true
      - name: governance-plugin
        configMap:
          name: hermes-governance-plugin
          optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: hermes-studio
  namespace: arcia
spec:
  selector:
    app: hermes-agent
  ports:
  - port: 9119
    targetPort: 9119
    name: studio
  - port: 8642
    targetPort: 8642
    name: gateway
