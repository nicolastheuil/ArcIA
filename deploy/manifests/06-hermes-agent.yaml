# ==============================================================================
# ArcIA v0.3 — Hermes Agent Runtime & Studio Dashboard
# ==============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-config
  namespace: arcia
data:
  config.yaml: |
    model:
      provider: custom
      base_url: http://litellm-proxy.arcia.svc:4000/v1
      default: arcia/standard
    agent:
      auto_approve_safe_commands: true
      max_iterations: 30
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-user-pvc
  namespace: arcia
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-agent
  namespace: arcia
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hermes-agent
  template:
    metadata:
      labels:
        app: hermes-agent
    spec:
      securityContext:
        fsGroup: 10000
      initContainers:
      - name: init-config-and-perms
        image: nousresearch/hermes-agent:latest
        command:
        - /bin/sh
        - -c
        - |
          mkdir -p /opt/data/.hermes /opt/data/shared-skills/arcia/ponytail /opt/data/shared-skills/arcia/graphify /opt/data/shared-skills/arcia/public-apis/scripts
          cp /etc/hermes/config.yaml /opt/data/.hermes/config.yaml
          if [ -d /opt/native-skills-cm ]; then
            [ -f /opt/native-skills-cm/ponytail-skill.md ] && cp /opt/native-skills-cm/ponytail-skill.md /opt/data/shared-skills/arcia/ponytail/SKILL.md
            [ -f /opt/native-skills-cm/graphify-skill.md ] && cp /opt/native-skills-cm/graphify-skill.md /opt/data/shared-skills/arcia/graphify/SKILL.md
            [ -f /opt/native-skills-cm/public-apis-skill.md ] && cp /opt/native-skills-cm/public-apis-skill.md /opt/data/shared-skills/arcia/public-apis/SKILL.md
            [ -f /opt/native-skills-cm/public-apis-script.py ] && cp /opt/native-skills-cm/public-apis-script.py /opt/data/shared-skills/arcia/public-apis/scripts/public_apis.py && chmod +x /opt/data/shared-skills/arcia/public-apis/scripts/public_apis.py
            [ -f /opt/native-skills-cm/public-apis-catalog.json ] && cp /opt/native-skills-cm/public-apis-catalog.json /opt/data/shared-skills/arcia/public-apis/catalog.json
          fi
          chown -R 10000:10000 /opt/data
        securityContext:
          runAsUser: 0
        volumeMounts:
        - name: user-state
          mountPath: /opt/data
        - name: hermes-cfg
          mountPath: /etc/hermes
        - name: native-skills
          mountPath: /opt/native-skills-cm
      containers:
      - name: hermes
        image: nousresearch/hermes-agent:latest
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - |
          mkdir -p $HOME/.hermes
          cp /opt/data/.hermes/config.yaml $HOME/.hermes/config.yaml
          exec hermes dashboard --host 0.0.0.0 --port 9119 --skip-build --no-open
        ports:
        - containerPort: 9119
          name: studio
        - containerPort: 8642
          name: gateway
        env:
        - name: API_SERVER_ENABLED
          value: "true"
        - name: API_SERVER_KEY
          valueFrom:
            secretKeyRef:
              name: hermes-gateway-secret
              key: api-server-key
        - name: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
          value: "admin"
        - name: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
          valueFrom:
            secretKeyRef:
              name: hermes-gateway-secret
              key: admin-password
        - name: HERMES_DASHBOARD_BASIC_AUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: hermes-gateway-secret
              key: api-server-key
        - name: OPENAI_BASE_URL
          value: "http://litellm-proxy.arcia.svc:4000/v1"
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1500m
            memory: 2Gi
        readinessProbe:
          httpGet:
            path: /
            port: 9119
          initialDelaySeconds: 20
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 9119
          initialDelaySeconds: 30
          periodSeconds: 20
        volumeMounts:
        - name: user-state
          mountPath: /opt/data
      volumes:
      - name: user-state
        persistentVolumeClaim:
          claimName: hermes-user-pvc
      - name: hermes-cfg
        configMap:
          name: hermes-config
      - name: native-skills
        configMap:
          name: arcia-native-skills
          optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: hermes-studio
  namespace: arcia
spec:
  selector:
    app: hermes-agent
  ports:
  - port: 9119
    targetPort: 9119
    name: studio
  - port: 8642
    targetPort: 8642
    name: gateway
