apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{NAME}}
  namespace: {{NAMESPACE}}
  annotations:
    arcia.io/owner: "{{OWNER}}"
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{NAME}}
  namespace: {{NAMESPACE}}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{NAME}}
  template:
    metadata:
      labels:
        app: {{NAME}}
        arcia.io/component: hermes-files
      annotations:
        checksum/files-code: "{{CODE_REVISION}}"
        checksum/hermes-config: "{{CONFIG_REVISION}}"
        checksum/hermes-runtime-guard: "{{GOVERNANCE_REVISION}}"
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 10000
      initContainers:
      - name: init-private-state
        image: {{IMAGE}}
        command: [sh, -c, "mkdir -p /opt/data/plugins/arcia_governance; cp /etc/hermes/config.yaml /opt/data/config.yaml; cp /etc/governance/plugin.py /opt/data/plugins/arcia_governance/plugin.py; chown -R 10000:10000 /opt/data"]
        volumeMounts:
        - {name: state, mountPath: /opt/data}
        - {name: config, mountPath: /etc/hermes, readOnly: true}
        - {name: governance, mountPath: /etc/governance, readOnly: true}
      containers:
      - name: hermes
        image: {{IMAGE}}
        command: [python3, /opt/arcia-governance/bootstrap.py, hermes, gateway]
        securityContext:
          runAsUser: 10000
          runAsGroup: 10000
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        env:
        - {name: HERMES_HOME, value: /opt/data}
        - {name: ARCIA_GOVERNANCE_REQUIRED, value: "true"}
        - {name: PYTHONPATH, value: /opt/arcia-governance}
        - {name: HOME, value: /opt/data}
        - {name: API_SERVER_ENABLED, value: "true"}
        - {name: API_SERVER_HOST, value: "127.0.0.1"}
        - {name: API_SERVER_PORT, value: "8642"}
        - name: API_SERVER_KEY
          valueFrom:
            secretKeyRef: {name: {{NAME}}, key: api-server-key}
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef: {name: {{INFERENCE_SECRET}}, key: virtual-key}
        - {name: OPENAI_BASE_URL, value: "http://litellm-proxy.{{NAMESPACE}}.svc:4000/v1"}
        - {name: PRESIDIO_DLP_URL, value: "http://presidio-dlp.{{NAMESPACE}}.svc:8080/sanitize"}
        - {name: PRESIDIO_FAIL_CLOSED, value: "true"}
        volumeMounts:
        - {name: state, mountPath: /opt/data}
        - {name: runtime-guard, mountPath: /opt/arcia-governance, readOnly: true}
        - {name: runtime-guard, mountPath: /opt/hermes/.venv/lib/python3.14/site-packages/arcia_governance.pth, subPath: arcia_governance.pth, readOnly: true}
        - {name: runtime-guard, mountPath: /opt/data/plugins/arcia_governance, readOnly: true}
        resources:
          requests: {cpu: 200m, memory: 512Mi}
          limits: {cpu: 1500m, memory: 2Gi}
      - name: files
        image: {{IMAGE}}
        command: [python3, /opt/arcia-files/files.py]
        securityContext:
          runAsUser: 10000
          runAsGroup: 10000
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        env:
        - {name: ARCIA_FILES_ROOT, value: /opt/data/exports}
        - name: API_SERVER_KEY
          valueFrom:
            secretKeyRef: {name: {{NAME}}, key: api-server-key}
        ports:
        - {containerPort: 8643, name: files}
        readinessProbe:
          httpGet: {path: /health, port: 8643}
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          httpGet: {path: /health, port: 8643}
          initialDelaySeconds: 90
          periodSeconds: 30
        volumeMounts:
        - {name: state, mountPath: /opt/data}
        - {name: code, mountPath: /opt/arcia-files, readOnly: true}
        resources:
          requests: {cpu: 50m, memory: 128Mi}
          limits: {cpu: 500m, memory: 512Mi}
      volumes:
      - name: runtime-guard
        configMap: {name: hermes-runtime-guard}
      - name: state
        persistentVolumeClaim: {claimName: {{NAME}}}
      - name: config
        configMap: {name: hermes-config}
      - name: governance
        configMap: {name: hermes-governance-plugin}
      - name: code
        configMap: {name: hermes-files-code}
---
apiVersion: v1
kind: Service
metadata:
  name: {{NAME}}
  namespace: {{NAMESPACE}}
spec:
  selector:
    app: {{NAME}}
  ports:
  - {port: 8643, targetPort: 8643, name: files}
