# ==============================================================================
# ArcIA v0.4 — Presidio DLP Sanitizer (Fail-Closed PII & Secrets Shield)
# Code source unique : services/presidio/app.py (injecté via ConfigMap presidio-code
# par scripts/deploy.py ou kubectl apply -k deploy/manifests)
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: presidio-dlp
  namespace: arcia
spec:
  replicas: 1
  selector:
    matchLabels:
      app: presidio-dlp
  template:
    metadata:
      labels:
        app: presidio-dlp
    spec:
      containers:
      - name: presidio
        image: python:3.11-slim
        workingDir: /app
        command:
        - /bin/sh
        - -c
        - |
          pip install --no-cache-dir fastapi uvicorn pydantic presidio-analyzer presidio-anonymizer spacy && \
          python -m spacy download fr_core_news_sm && \
          python -m spacy download en_core_web_sm && \
          uvicorn app:app --host 0.0.0.0 --port 8080
        ports:
        - containerPort: 8080
          name: http
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1536Mi
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 45
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 20
        volumeMounts:
        - name: code
          mountPath: /app
      volumes:
      - name: code
        configMap:
          name: presidio-code
---
apiVersion: v1
kind: Service
metadata:
  name: presidio-dlp
  namespace: arcia
spec:
  selector:
    app: presidio-dlp
  ports:
  - port: 8080
    targetPort: 8080
    name: http
