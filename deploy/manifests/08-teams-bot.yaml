# ==============================================================================
# ArcIA v0.4 — Microsoft Teams Bot Adapter
# Code source unique : services/teams/app.py (injecté via ConfigMap teams-bot-code
# par scripts/deploy.py ou kubectl apply -k deploy/manifests)
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: teams-bot-adapter
  namespace: arcia
spec:
  replicas: 1
  selector:
    matchLabels:
      app: teams-bot-adapter
  template:
    metadata:
      labels:
        app: teams-bot-adapter
      annotations:
        checksum/teams-bot-code: "default"
    spec:
      containers:
      - name: adapter
        image: python:3.11-slim
        workingDir: /app
        command:
        - /bin/sh
        - -c
        - |
          pip install --no-cache-dir botbuilder-core botbuilder-schema aiohttp && \
          python app.py
        env:
        - name: MICROSOFT_APP_ID
          valueFrom:
            secretKeyRef:
              name: teams-bot-secret
              key: app-id
        - name: MICROSOFT_APP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: teams-bot-secret
              key: app-password
        - name: MICROSOFT_APP_TENANT_ID
          valueFrom:
            secretKeyRef:
              name: teams-bot-secret
              key: tenant-id
              optional: true
        - name: LITELLM_URL
          value: "http://litellm-proxy.arcia.svc:4000/v1"
        - name: HERMES_URL
          value: "http://hermes-studio.arcia.svc:8642/v1"
        - name: PRESIDIO_URL
          value: "http://presidio-dlp.arcia.svc:8080"
        - name: TEAMS_DEFAULT_MODEL
          value: "simple/auto"
        - name: TEAMS_SYSTEM_PROMPT
          value: "Tu es ArcIA, l'assistant et orchestrateur agentique d'entreprise. Réponds de façon synthétique, professionnelle et structurée en Markdown."
        - name: LITELLM_API_KEY
          valueFrom:
            secretKeyRef:
              name: litellm-secret
              key: master-key
        - name: HERMES_API_KEY
          valueFrom:
            secretKeyRef:
              name: hermes-gateway-secret
              key: api-server-key
        ports:
        - containerPort: 3978
          name: http
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        startupProbe:
          httpGet:
            path: /healthz
            port: 3978
          initialDelaySeconds: 15
          periodSeconds: 5
          failureThreshold: 20
        readinessProbe:
          httpGet:
            path: /healthz
            port: 3978
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: 3978
          initialDelaySeconds: 45
          periodSeconds: 15
          failureThreshold: 3
        volumeMounts:
        - name: code
          mountPath: /app
      volumes:
      - name: code
        configMap:
          name: teams-bot-code
---
apiVersion: v1
kind: Service
metadata:
  name: teams-bot-adapter
  namespace: arcia
spec:
  selector:
    app: teams-bot-adapter
  ports:
  - port: 3978
    targetPort: 3978
