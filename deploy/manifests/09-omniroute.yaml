# ==============================================================================
# ArcIA — OmniRoute AI Router (Optionnel)
# ==============================================================================
# OmniRoute v3.8.51 : Routeur multi-fournisseurs avec portail d'administration LAN
# et modes intelligents auto/smart.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: omniroute-data-pvc
  namespace: arcia
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: omniroute
  namespace: arcia
spec:
  replicas: 1
  selector:
    matchLabels:
      app: omniroute
  template:
    metadata:
      labels:
        app: omniroute
    spec:
      containers:
      - name: omniroute
        image: node:22-alpine
        command: ["/bin/sh", "-c", "apk add --no-cache lsof && if [ ! -f /data/node_modules/omniroute/bin/omniroute.mjs ]; then cd /data && npm install omniroute@3.8.51; fi; cd /data && exec node node_modules/omniroute/bin/omniroute.mjs --port 20128 --no-open --log"]
        ports:
        - containerPort: 20128
          name: api
        - containerPort: 20129
          name: admin
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "20128"
        - name: HOSTNAME
          value: "0.0.0.0"
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: omniroute-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: omniroute
  namespace: arcia
spec:
  selector:
    app: omniroute
  ports:
  - name: api
    port: 20128
    targetPort: 20128
  - name: admin
    port: 20129
    targetPort: 20129
