# ==============================================================================
# Configuration LiteLLM Proxy pour ArcIA v0.3 (Mode Lab / Docker Local)
# ==============================================================================
model_list:
  # 1. Palier Standard (Défaut) : Économique, rapide, souverain
  - model_name: "arcia/standard"
    litellm_params:
      model: openrouter/anthropic/claude-haiku-5.5
      api_key: os.environ/OPENROUTER_API_KEY
      extra_body:
        provider:
          zdr: true

  # 2. Palier Expert : Raisonnement approfondi et tâches agentiques complexes
  - model_name: "arcia/expert"
    litellm_params:
      model: openrouter/anthropic/claude-sonnet-5.5
      api_key: os.environ/OPENROUTER_API_KEY
      extra_body:
        provider:
          zdr: true

  # 3. Palier Raisonnement : Analyse architecturale et résolution critique
  - model_name: "arcia/reasoning"
    litellm_params:
      model: openrouter/deepseek/deepseek-v4.1-flash
      api_key: os.environ/OPENROUTER_API_KEY
      extra_body:
        provider:
          zdr: true

router_settings:
  fallbacks:
    - "arcia/standard": ["arcia/expert"]
    - "arcia/expert": ["arcia/standard"]
    - "arcia/reasoning": ["arcia/expert"]
  model_group_alias:
    "ArcIA-Agentic (auto)":
      model: "arcia/standard"
      hidden: true
    "ArcIA-Agentic (expert)":
      model: "arcia/expert"
      hidden: true
    "auto":
      model: "arcia/standard"
      hidden: true
    "hermes-agent":
      model: "arcia/standard"
      hidden: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

guardrails:
  # Anonymisation universelle obligatoire et fail-closed vers le Cloud
  - guardrail_name: "presidio-guard"
    litellm_params:
      guardrail: presidio
      mode: "pre_call"
      default_on: true
      presidio_analyzer_api_base: "http://presidio-analyzer:3000"
      presidio_anonymizer_api_base: "http://presidio-anonymizer:3000"

litellm_settings:
  drop_params: true
  set_verbose: false
