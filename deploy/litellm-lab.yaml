# ==============================================================================
# Configuration LiteLLM Proxy pour ArcIA v0.4 (Mode Lab / Docker Local)
# ==============================================================================
model_list:
  # 1. simple/free : direct LiteLLM vers OpenRouter Free
  - model_name: "simple/free"
    litellm_params:
      model: openrouter/openrouter/free
      api_key: os.environ/OPENROUTER_API_KEY
      extra_body:
        provider:
          data_collection: "deny"
          zdr: true
          allow_fallbacks: false

  # 2. simple/auto : direct LiteLLM vers OpenRouter Auto
  - model_name: "simple/auto"
    litellm_params:
      model: openrouter/auto
      api_key: os.environ/OPENROUTER_API_KEY
      extra_body:
        provider:
          data_collection: "deny"
          zdr: true
          allow_fallbacks: false

  # 3. agentic/free : profil agentique gratuit via OpenRouter Free (ZDR)
  - model_name: "agentic/free"
    litellm_params:
      model: openrouter/openrouter/free
      api_key: os.environ/OPENROUTER_API_KEY
      extra_body:
        provider:
          data_collection: "deny"
          zdr: true
          allow_fallbacks: false

  # 4. agentic/auto : profil agentique standard équilibré via OpenRouter Auto (ZDR)
  - model_name: "agentic/auto"
    litellm_params:
      model: openrouter/auto
      api_key: os.environ/OPENROUTER_API_KEY
      extra_body:
        provider:
          data_collection: "deny"
          zdr: true
          allow_fallbacks: false

  # 5. agentic/expert : profil agentique raisonnement avancé via DeepSeek V4.1 Flash (ZDR)
  - model_name: "agentic/expert"
    litellm_params:
      model: openrouter/deepseek/deepseek-v4.1-flash
      api_key: os.environ/OPENROUTER_API_KEY
      extra_body:
        provider:
          data_collection: "deny"
          zdr: true
          allow_fallbacks: false

router_settings:
  fallbacks:
    - "simple/auto": ["simple/free"]
    - "agentic/free": ["agentic/auto"]
    - "agentic/auto": ["agentic/expert", "simple/auto"]
    - "agentic/expert": ["agentic/auto", "simple/auto"]
  model_group_alias:
    "openrouter/free":
      model: "simple/free"
      hidden: true
    "openrouter/auto":
      model: "simple/auto"
      hidden: true
    "openrouter/deepseek/deepseek-v4.1-flash":
      model: "agentic/expert"
      hidden: true
    "auto":
      model: "simple/auto"
      hidden: true
    "hermes-agent":
      model: "agentic/auto"
      hidden: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

guardrails:
  # Anonymisation universelle obligatoire et fail-closed vers le Cloud
  - guardrail_name: "presidio-guard"
    litellm_params:
      guardrail: presidio
      mode: "pre_call"
      default_on: true
      presidio_analyzer_api_base: "http://presidio-analyzer:3000"
      presidio_anonymizer_api_base: "http://presidio-anonymizer:3000"

litellm_settings:
  drop_params: true
  set_verbose: false
  callbacks: error_handler.proxy_handler_instance
