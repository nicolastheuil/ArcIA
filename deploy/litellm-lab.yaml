# ==============================================================================
# Configuration LiteLLM Proxy pour ArcIA v0.3 (Mode Lab / Docker Local)
# ==============================================================================
model_list:
  # 1. Palier Gratuit : Découverte et qualification sans coût
  - model_name: "arcia/free"
    litellm_params:
      model: openrouter/openrouter/free
      api_key: os.environ/OPENROUTER_API_KEY
      extra_body:
        provider:
          zdr: true

  # 2. Palier Auto (Défaut) : Routage automatique intelligent
  - model_name: "arcia/auto"
    litellm_params:
      model: openrouter/auto
      api_key: os.environ/OPENROUTER_API_KEY
      extra_body:
        provider:
          zdr: true

  # 3. Palier Expert : Raisonnement approfondi et tâches agentiques complexes
  - model_name: "arcia/expert"
    litellm_params:
      model: openrouter/anthropic/claude-3.7-sonnet
      api_key: os.environ/OPENROUTER_API_KEY
      extra_body:
        provider:
          zdr: true

router_settings:
  fallbacks:
    - "arcia/free": ["arcia/auto"]
    - "arcia/auto": ["arcia/expert"]
    - "arcia/expert": ["arcia/auto"]
  model_group_alias:
    "arcia/standard":
      model: "arcia/auto"
      hidden: true
    "arcia/reasoning":
      model: "arcia/expert"
      hidden: true
    "ArcIA-Agentic (auto)":
      model: "arcia/auto"
      hidden: true
    "ArcIA-Agentic (expert)":
      model: "arcia/expert"
      hidden: true
    "auto":
      model: "arcia/auto"
      hidden: true
    "hermes-agent":
      model: "arcia/auto"
      hidden: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

guardrails:
  # Anonymisation universelle obligatoire et fail-closed vers le Cloud
  - guardrail_name: "presidio-guard"
    litellm_params:
      guardrail: presidio
      mode: "pre_call"
      default_on: true
      presidio_analyzer_api_base: "http://presidio-analyzer:3000"
      presidio_anonymizer_api_base: "http://presidio-anonymizer:3000"

litellm_settings:
  drop_params: true
  set_verbose: false
