# ==============================================================================
# Configuration LiteLLM Proxy pour ArcIA v0.3 (Mode Lab / Docker Local)
# ==============================================================================
model_list:
  # 1. simple/free : direct LiteLLM vers OpenRouter Free
  - model_name: "simple/free"
    litellm_params:
      model: openrouter/openrouter/free
      api_key: os.environ/OPENROUTER_API_KEY
      extra_body:
        provider:
          zdr: true

  # 2. simple/auto : direct LiteLLM vers OpenRouter Auto
  - model_name: "simple/auto"
    litellm_params:
      model: openrouter/auto
      api_key: os.environ/OPENROUTER_API_KEY
      extra_body:
        provider:
          zdr: true

  # 3. openrouter/deepseek/deepseek-v4.1-flash : modèle d'inférence pour l'agent
  - model_name: "openrouter/deepseek/deepseek-v4.1-flash"
    litellm_params:
      model: openrouter/deepseek/deepseek-v4.1-flash
      api_key: os.environ/OPENROUTER_API_KEY
      extra_body:
        provider:
          zdr: true

router_settings:
  fallbacks:
    - "simple/free": ["simple/auto"]
    - "simple/auto": ["simple/free"]
  model_group_alias:
    "openrouter/free":
      model: "simple/free"
      hidden: true
    "openrouter/auto":
      model: "simple/auto"
      hidden: true
    "openrouter/deepseek-v4.1-flash":
      model: "openrouter/deepseek/deepseek-v4.1-flash"
      hidden: true
    "arcia/free":
      model: "simple/free"
      hidden: true
    "arcia/auto":
      model: "simple/auto"
      hidden: true
    "arcia/expert":
      model: "openrouter/deepseek/deepseek-v4.1-flash"
      hidden: true
    "arcia/standard":
      model: "simple/auto"
      hidden: true
    "arcia/reasoning":
      model: "openrouter/deepseek/deepseek-v4.1-flash"
      hidden: true
    "auto":
      model: "simple/auto"
      hidden: true
    "hermes-agent":
      model: "simple/auto"
      hidden: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

guardrails:
  # Anonymisation universelle obligatoire et fail-closed vers le Cloud
  - guardrail_name: "presidio-guard"
    litellm_params:
      guardrail: presidio
      mode: "pre_call"
      default_on: true
      presidio_analyzer_api_base: "http://presidio-analyzer:3000"
      presidio_anonymizer_api_base: "http://presidio-anonymizer:3000"

litellm_settings:
  drop_params: true
  set_verbose: false
